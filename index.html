<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<title>2D 멀티플레이 액션 게임</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    background: #1e1e2e;
    overflow: hidden;
    font-family: 'Segoe UI', sans-serif;
    color: #fff;
    width: 100%;
    height: 100%;
    touch-action: none;
    overscroll-behavior: none;
    -webkit-user-select: none;
    user-select: none;
  }
  #gameCanvas {
    display: block;
    margin: 20px auto 0 auto;
    background: #2c3e50;
    border: 3px solid #34495e;
    border-radius: 8px;
    cursor: crosshair;
    max-width: calc(100vw - 20px);
    max-height: calc(100vh - 30px);
    width: auto;
    height: auto;
    touch-action: none;
  }
  /* ===== 모바일 가상 조이스틱 ===== */
  .stick-base {
    position: fixed;
    bottom: calc(34px + env(safe-area-inset-bottom, 0px));
    width: 132px;
    height: 132px;
    border-radius: 50%;
    background: rgba(255, 255, 255, 0.12);
    border: 2px solid rgba(255, 255, 255, 0.35);
    touch-action: none;
    z-index: 5;
    display: none;
    transition: background 0.1s, border-color 0.1s;
  }
  .stick-base.dragging {
    background: rgba(255, 255, 255, 0.2);
    border-color: rgba(255, 255, 255, 0.6);
  }
  #leftStick { left: calc(18px + env(safe-area-inset-left, 0px)); }
  #rightStick { right: calc(18px + env(safe-area-inset-right, 0px)); }
  .stick-nub {
    position: absolute;
    top: 50%;
    left: 50%;
    width: 58px;
    height: 58px;
    margin: -29px 0 0 -29px;
    border-radius: 50%;
    background: rgba(255, 255, 255, 0.5);
    pointer-events: none;
    transition: background 0.1s;
  }
  .stick-base.dragging .stick-nub { background: rgba(255, 255, 255, 0.85); }
  body.touch-device .stick-base { display: block; }
  body.touch-device #hint { display: none; }
  #mobileHint {
    position: fixed;
    top: 14px;
    left: 50%;
    transform: translateX(-50%);
    background: rgba(0,0,0,0.55);
    padding: 8px 14px;
    border-radius: 8px;
    font-size: 12px;
    text-align: center;
    z-index: 8;
    display: none;
    pointer-events: none;
    transition: opacity 0.6s ease;
  }
  body.touch-device #mobileHint { display: block; }
  @media (max-width: 480px) {
    .stick-base { width: 112px; height: 112px; bottom: calc(24px + env(safe-area-inset-bottom, 0px)); }
    .stick-nub { width: 50px; height: 50px; margin: -25px 0 0 -25px; }
  }
  #scoreboardToggleBtn {
    position: fixed;
    top: calc(20px + env(safe-area-inset-top, 0px));
    right: calc(20px + env(safe-area-inset-right, 0px));
    width: 44px;
    height: 44px;
    border-radius: 50%;
    border: none;
    background: rgba(0, 0, 0, 0.55);
    color: #fff;
    font-size: 20px;
    cursor: pointer;
    z-index: 9;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  #scoreboardToggleBtn:hover { background: rgba(0, 0, 0, 0.75); }
  #sfxToggleBtn {
    position: fixed;
    top: calc(20px + env(safe-area-inset-top, 0px));
    right: calc(74px + env(safe-area-inset-right, 0px));
    width: 44px;
    height: 44px;
    border-radius: 50%;
    border: none;
    background: rgba(0, 0, 0, 0.55);
    color: #fff;
    font-size: 20px;
    cursor: pointer;
    z-index: 9;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  #sfxToggleBtn:hover { background: rgba(0, 0, 0, 0.75); }
  #scoreboard {
    position: fixed;
    top: calc(72px + env(safe-area-inset-top, 0px));
    right: calc(20px + env(safe-area-inset-right, 0px));
    background: rgba(0, 0, 0, 0.55);
    border-radius: 8px;
    padding: 12px 16px;
    min-width: 160px;
    z-index: 9;
    display: none;
  }
  #scoreboard.open { display: block; }
  #scoreboard h3 {
    margin: 0 0 8px 0;
    font-size: 15px;
    border-bottom: 1px solid #555;
    padding-bottom: 6px;
  }
  #scoreboard ol {
    margin: 0;
    padding-left: 18px;
    font-size: 13px;
    line-height: 1.6;
  }
  #scoreboard ol .team-header {
    list-style: none;
    margin: 6px 0 2px -18px;
    font-size: 12px;
    color: #f1c40f;
  }
  #scoreboard ol .team-header:first-child { margin-top: 0; }
  /* ===== 접속자 수 배지 (항상 표시) ===== */
  #onlineCountBadge {
    position: fixed;
    top: calc(14px + env(safe-area-inset-top, 0px));
    left: 50%;
    transform: translateX(-50%);
    background: rgba(0, 0, 0, 0.55);
    border-radius: 999px;
    padding: 6px 14px;
    font-size: 12px;
    z-index: 11;
    pointer-events: none;
    white-space: nowrap;
  }
  @media (max-width: 480px) {
    #onlineCountBadge { top: calc(8px + env(safe-area-inset-top, 0px)); font-size: 11px; padding: 5px 10px; }
  }
  #joinOverlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.75);
    display: flex;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    z-index: 10;
  }
  #joinOverlay input {
    padding: 10px 14px;
    font-size: 16px;
    border-radius: 6px;
    border: none;
    margin: 12px 0;
    width: 220px;
    text-align: center;
  }
  #joinOverlay button {
    padding: 10px 24px;
    font-size: 16px;
    border-radius: 6px;
    border: none;
    background: #3498db;
    color: #fff;
    cursor: pointer;
  }
  #joinOverlay button:hover { background: #2980b9; }
  #hint {
    position: fixed;
    bottom: 12px;
    left: 20px;
    font-size: 12px;
    color: #aaa;
  }
  /* ===== 로그인 / 코인 / 잠금 캐릭터 ===== */
  #authMsg { min-height: 18px; margin: 2px 0 10px 0; font-size: 13px; color: #e74c3c; text-align: center; max-width: 280px; }
  #authMsg.ok { color: #2ecc71; }
  #joinOverlay .auth-btns { display: flex; gap: 10px; }
  #joinOverlay button.secondary { background: #7f8c8d; }
  #joinOverlay button.secondary:hover { background: #6b7677; }
  #joinOverlay button:disabled { opacity: 0.6; cursor: default; }
  .profile-line { font-size: 14px; color: #f1c40f; margin: 0 0 16px 0; text-align: center; }
  .profile-line:empty { display: none; }
  #logoutBtn { margin-top: 20px; padding: 8px 18px; font-size: 13px; border-radius: 6px; border: none; background: #7f8c8d; color: #fff; cursor: pointer; }
  #logoutBtn:hover { background: #6b7677; }
  .char-card.locked { border-color: #6c3483; }
  .char-card .trophy-line { font-size: 12px; color: #f1c40f; margin: 2px 0 6px 0; }
  .char-card.locked .char-avatar { filter: grayscale(0.7); }
  .char-card button.locked-btn { background: #8e44ad; }
  .char-card button.locked-btn:hover { background: #7d3c98; }
  .char-card button.locked-btn:disabled { background: #555; cursor: not-allowed; }
  /* ===== 모드 선택 화면 ===== */
  #modeOverlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.85);
    display: none;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    z-index: 10;
    text-align: center;
  }
  #modeOverlay h2 { margin: 0 0 20px 0; }
  #modeList { display: flex; gap: 16px; flex-wrap: wrap; justify-content: center; }
  .mode-card {
    background: #2c3e50;
    border: 2px solid #34495e;
    border-radius: 10px;
    padding: 20px 26px;
    width: 170px;
    cursor: pointer;
  }
  .mode-card:hover { border-color: #3498db; }
  .mode-card .mode-title { font-size: 22px; font-weight: bold; margin-bottom: 6px; }
  .mode-card .mode-desc { font-size: 12px; color: #ccc; }
  /* ===== 1:1 매칭 대기 화면 ===== */
  #matchingOverlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.8);
    display: none;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    z-index: 10;
    text-align: center;
    padding: 0 20px;
    box-sizing: border-box;
  }
  #matchingOverlay.open { display: flex; }
  .matching-spinner {
    width: 46px;
    height: 46px;
    border-radius: 50%;
    border: 4px solid rgba(255,255,255,0.2);
    border-top-color: #3498db;
    animation: matchSpin 0.9s linear infinite;
    margin: 18px 0;
  }
  @keyframes matchSpin { to { transform: rotate(360deg); } }
  #matchingStatus { color: #bbb; font-size: 13px; margin-bottom: 20px; }
  #cancelMatchBtn {
    padding: 9px 22px;
    font-size: 14px;
    border-radius: 6px;
    border: none;
    background: #7f8c8d;
    color: #fff;
    cursor: pointer;
  }
  #cancelMatchBtn:hover { background: #6b7677; }
  /* ===== 대결(VS) 화면: 매칭 직후 상대 캐릭터/트로피를 보여주고 카운트다운 ===== */
  #versusOverlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.88);
    display: none;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    z-index: 30;
    text-align: center;
    padding: 0 12px;
    box-sizing: border-box;
    color: #fff;
  }
  #versusOverlay.open { display: flex; }
  .vs-title { font-size: 22px; font-weight: bold; margin-bottom: 18px; color: #f1c40f; }
  .vs-teams { display: flex; align-items: center; justify-content: center; gap: 18px; flex-wrap: wrap; }
  .vs-side { display: flex; flex-direction: column; gap: 10px; }
  .vs-side-label { font-size: 12px; color: #aaa; }
  .vs-card {
    width: 150px;
    background: rgba(255,255,255,0.08);
    border: 2px solid rgba(255,255,255,0.15);
    border-radius: 12px;
    padding: 12px 8px;
    box-sizing: border-box;
  }
  .vs-card.me { border-color: #3498db; }
  .vs-card.enemy { border-color: #e74c3c; }
  .vs-avatar {
    width: 60px; height: 60px; border-radius: 50%;
    margin: 0 auto 8px;
    display: flex; align-items: center; justify-content: center;
    font-size: 28px; font-weight: bold; color: #fff;
    border: 3px solid rgba(255,255,255,0.4);
  }
  .vs-name { font-size: 15px; font-weight: bold; word-break: break-all; }
  .vs-char { font-size: 12px; color: #ccc; margin-top: 2px; }
  .vs-trophy { font-size: 13px; margin-top: 6px; color: #f1c40f; }
  .vs-mark { font-size: 40px; font-weight: bold; color: #e74c3c; text-shadow: 0 0 12px rgba(231,76,60,0.7); }
  #vsCountdown { font-size: 54px; font-weight: bold; margin-top: 22px; }
  @media (max-width: 560px) {
    .vs-card { width: 120px; padding: 8px 6px; }
    .vs-avatar { width: 46px; height: 46px; font-size: 22px; }
    .vs-mark { font-size: 28px; }
    .vs-teams { gap: 10px; }
  }
  /* ===== 매치 결과 화면 ===== */
  #matchResultOverlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.85);
    display: none;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    z-index: 10;
    text-align: center;
    padding: 0 20px;
    box-sizing: border-box;
  }
  #matchResultOverlay.open { display: flex; }
  #matchResultTitle { font-size: 30px; margin: 0 0 8px 0; }
  #matchResultTitle.win { color: #2ecc71; }
  #matchResultTitle.lose { color: #e74c3c; }
  #matchResultDesc { color: #ccc; font-size: 14px; margin-bottom: 22px; }
  #matchResultOverlay button {
    padding: 10px 26px;
    font-size: 15px;
    border-radius: 6px;
    border: none;
    background: #3498db;
    color: #fff;
    cursor: pointer;
    margin: 0 6px;
  }
  #matchResultOverlay button:hover { background: #2980b9; }
  #matchResultOverlay button#backToMenuBtn { background: #7f8c8d; }
  #matchResultOverlay button#backToMenuBtn:hover { background: #6b7677; }
  /* ===== 캐릭터 선택 화면 ===== */
  #characterOverlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.85);
    display: none;
    align-items: center;
    justify-content: flex-start;
    flex-direction: column;
    overflow-y: auto;            /* 화면이 작아 카드가 넘칠 때 스크롤로 접근 가능하게 함 */
    -webkit-overflow-scrolling: touch;
    box-sizing: border-box;
    padding: 20px 12px calc(20px + env(safe-area-inset-bottom, 0px));
    z-index: 10;
  }
  #characterOverlay h2 { margin: 8px 0 18px 0; flex-shrink: 0; }
  #characterList {
    display: flex;
    gap: 16px;
    flex-wrap: wrap;
    justify-content: center;
    max-width: 90vw;
  }
  .char-card {
    background: #2c3e50;
    border: 2px solid #34495e;
    border-radius: 10px;
    padding: 16px;
    width: 190px;
    text-align: center;
  }
  .char-avatar {
    width: 64px;
    height: 64px;
    border-radius: 50%;
    margin: 0 auto 10px auto;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 28px;
    font-weight: bold;
    color: #fff;
  }
  .char-card h3 { margin: 6px 0; }
  .char-card .stat-line {
    font-size: 12px;
    color: #ccc;
    text-align: left;
    margin: 4px 0;
  }
  .char-card button {
    margin-top: 12px;
    padding: 8px 20px;
    font-size: 14px;
    border-radius: 6px;
    border: none;
    background: #2ecc71;
    color: #fff;
    cursor: pointer;
    width: 100%;
  }
  .char-card button:hover { background: #27ae60; }
  /* 화면이 작은 모바일에서는 카드/버튼 크기를 줄여 3개 캐릭터(슈 포함)가 한 화면에 더 잘 들어오게 함 */
  @media (max-width: 480px), (max-height: 700px) {
    #characterOverlay h2 { font-size: 18px; margin: 4px 0 10px 0; }
    #characterList { gap: 10px; }
    .char-card { width: 130px; padding: 10px; }
    .char-avatar { width: 46px; height: 46px; font-size: 18px; margin-bottom: 6px; }
    .char-card h3 { font-size: 14px; margin: 4px 0; }
    .char-card .stat-line { font-size: 10px; margin: 2px 0; }
    .char-card button { padding: 6px 10px; font-size: 12px; margin-top: 8px; }
  }
  /* ===== 궁극기 버튼 ===== */
  #ultimateButton {
    position: fixed;
    bottom: calc(185px + env(safe-area-inset-bottom, 0px));
    right: calc(30px + env(safe-area-inset-right, 0px));
    width: 74px;
    height: 74px;
    border-radius: 50%;
    z-index: 6;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    background: conic-gradient(#f1c40f 0%, rgba(255,255,255,0.15) 0%);
  }
  #ultimateButton.ready { animation: ultPulse 1s infinite; }
  #ultimateButton.armed { box-shadow: 0 0 0 4px rgba(231, 76, 60, 0.9); animation: none; }
  #ultimateButton .ult-inner {
    width: 60px;
    height: 60px;
    border-radius: 50%;
    background: #1e1e2e;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 26px;
  }
  #ultimateButton.armed .ult-inner { background: #7a1f1f; }
  @keyframes ultPulse {
    0%, 100% { box-shadow: 0 0 0px rgba(241, 196, 15, 0.8); }
    50% { box-shadow: 0 0 18px rgba(241, 196, 15, 0.9); }
  }
  /* ===== 가젯 버튼 (궁극기 버튼 왼쪽, 핀란드 국기 무늬) ===== */
  #gadgetButton {
    position: fixed;
    bottom: calc(192px + env(safe-area-inset-bottom, 0px));
    right: calc(116px + env(safe-area-inset-right, 0px));
    width: 60px;
    height: 60px;
    border-radius: 50%;
    z-index: 6;
    display: none;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    background: conic-gradient(#003580 100%, rgba(255,255,255,0.15) 100%);
  }
  #gadgetButton.ready { animation: gadPulse 1s infinite; }
  #gadgetButton.armed { box-shadow: 0 0 0 4px rgba(231, 76, 60, 0.9); animation: none; }
  #gadgetButton .gad-inner {
    position: relative;
    width: 48px;
    height: 48px;
    border-radius: 50%;
    background:
      linear-gradient(#003580, #003580) 0 50% / 100% 22% no-repeat,
      linear-gradient(#003580, #003580) 30% 0 / 22% 100% no-repeat,
      #fff;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }
  #gadgetButton .gad-cd {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    background: rgba(0, 0, 0, 0.55);
    color: #fff;
    font-weight: 700;
    font-size: 18px;
    opacity: 0;
  }
  #gadgetButton .gad-cd:not(:empty) { opacity: 1; }
  @keyframes gadPulse {
    0%, 100% { box-shadow: 0 0 0px rgba(0, 53, 128, 0.8); }
    50% { box-shadow: 0 0 16px rgba(0, 120, 255, 0.9); }
  }
  @media (max-width: 480px) {
    #gadgetButton { right: calc(98px + env(safe-area-inset-right, 0px)); bottom: calc(165px + env(safe-area-inset-bottom, 0px)); width: 52px; height: 52px; }
    #gadgetButton .gad-inner { width: 42px; height: 42px; }
    #gadgetButton .gad-cd { font-size: 15px; }
  }
  @media (max-width: 480px) {
    #scoreboardToggleBtn { top: calc(10px + env(safe-area-inset-top, 0px)); right: calc(10px + env(safe-area-inset-right, 0px)); width: 36px; height: 36px; font-size: 16px; }
    #sfxToggleBtn { top: calc(10px + env(safe-area-inset-top, 0px)); right: calc(56px + env(safe-area-inset-right, 0px)); width: 36px; height: 36px; font-size: 16px; }
    #scoreboard { top: calc(54px + env(safe-area-inset-top, 0px)); right: calc(10px + env(safe-area-inset-right, 0px)); min-width: 120px; padding: 8px 10px; }
    #scoreboard h3 { font-size: 12px; }
    #scoreboard ol { font-size: 11px; }
    #ultimateButton { right: calc(26px + env(safe-area-inset-right, 0px)); bottom: calc(160px + env(safe-area-inset-bottom, 0px)); width: 62px; height: 62px; }
    #ultimateButton .ult-inner { width: 50px; height: 50px; font-size: 22px; }
  }
  /* ===== 탄창(탄약) 표시 ===== */
  #ammoDisplay {
    position: fixed;
    bottom: calc(45px + env(safe-area-inset-bottom, 0px));
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    gap: 8px;
    z-index: 6;
  }
  #ammoDisplay .ammo-dot {
    width: 16px;
    height: 16px;
    border-radius: 50%;
    background: #f39c12;
    border: 2px solid #7a4e0a;
    transition: background 0.15s, opacity 0.15s;
  }
  #ammoDisplay .ammo-dot.empty {
    background: rgba(255,255,255,0.12);
    border-color: rgba(255,255,255,0.25);
  }
  /* ===== 채팅 (좌측 상단) ===== */
  #chatContainer {
    position: fixed;
    left: calc(18px + env(safe-area-inset-left, 0px));
    top: calc(64px + env(safe-area-inset-top, 0px));
    width: 300px;
    max-width: calc(100vw - 40px);
    z-index: 7;
    display: flex;
    flex-direction: column;
    gap: 6px;
    pointer-events: none; /* 빈 여백 부분은 터치를 그대로 통과시켜 조이스틱을 가리지 않게 함 */
  }
  #chatLog {
    display: flex;
    flex-direction: column;
    gap: 3px;
    max-height: min(150px, 22vh); /* 화면이 낮은(가로 모드) 기기에서 왼쪽 조이스틱까지 내려오지 않도록 제한 */
    overflow-y: auto;
    pointer-events: none;
  }
  #chatLog::-webkit-scrollbar { width: 0; }
  #chatLog .chat-line {
    background: rgba(0,0,0,0.5);
    border-radius: 6px;
    padding: 4px 9px;
    font-size: 12px;
    line-height: 1.4;
    width: fit-content;
    max-width: 100%;
    word-break: break-word;
  }
  #chatLog .chat-line .chat-name { font-weight: bold; margin-right: 4px; }
  #chatInputRow { display: flex; gap: 6px; pointer-events: auto; }
  #chatInput {
    display: none;
    flex: 1;
    padding: 8px 10px;
    font-size: 13px;
    border-radius: 6px;
    border: none;
    outline: none;
    background: rgba(0,0,0,0.65);
    color: #fff;
    box-sizing: border-box;
  }
  #chatInput.active { display: block; }
  #chatInput::placeholder { color: rgba(255,255,255,0.5); }

// ===== 효과음 (Web Audio API로 직접 합성 - 별도 파일 필요 없음) =====
const SFX = (() => {
  let ctx = null;
  function ensureCtx() {
    if (!ctx) ctx = new (window.AudioContext || window.webkitAudioContext)();
    if (ctx.state === 'suspended') ctx.resume();
    return ctx;
  }

  let enabled = localStorage.getItem('sfxEnabled') !== 'off';
  function setEnabled(v) { enabled = v; localStorage.setItem('sfxEnabled', v ? 'on' : 'off'); }
  function isEnabled() { return enabled; }

  // 단순 톤(삐- 소리) 하나를 재생. freqEnd를 주면 주파수가 시간에 따라 미끄러지듯 변함
  function beep({ freq = 440, freqEnd = null, duration = 0.1, type = 'square', volume = 0.2, delay = 0 }) {
    if (!enabled) return;
    try {
      const ac = ensureCtx();
      const t0 = ac.currentTime + delay;
      const osc = ac.createOscillator();
      const gain = ac.createGain();
      osc.type = type;
      osc.frequency.setValueAtTime(freq, t0);
      if (freqEnd !== null) osc.frequency.exponentialRampToValueAtTime(Math.max(1, freqEnd), t0 + duration);
      gain.gain.setValueAtTime(volume, t0);
      gain.gain.exponentialRampToValueAtTime(0.001, t0 + duration);
      osc.connect(gain);
      gain.connect(ac.destination);
      osc.start(t0);
      osc.stop(t0 + duration + 0.03);
    } catch (e) { /* 오디오를 지원하지 않는 환경은 조용히 무시 */ }
  }

  // 짧은 백색소음(타격감/폭발감을 위한 노이즈)
  function noiseBurst({ duration = 0.15, volume = 0.2, delay = 0 }) {
    if (!enabled) return;
    try {
      const ac = ensureCtx();
      const size = Math.max(1, Math.floor(ac.sampleRate * duration));
      const buffer = ac.createBuffer(1, size, ac.sampleRate);
      const data = buffer.getChannelData(0);
      for (let i = 0; i < size; i++) data[i] = (Math.random() * 2 - 1) * (1 - i / size);
      const src = ac.createBufferSource();
      src.buffer = buffer;
      const gain = ac.createGain();
      const t0 = ac.currentTime + delay;
      gain.gain.setValueAtTime(volume, t0);
      gain.gain.exponentialRampToValueAtTime(0.001, t0 + duration);
      src.connect(gain);
      gain.connect(ac.destination);
      src.start(t0);
    } catch (e) {}
  }

  return {
    setEnabled, isEnabled,
    shoot() { beep({ freq: 750, freqEnd: 320, duration: 0.07, type: 'square', volume: 0.12 }); },
    ultimate() { beep({ freq: 200, freqEnd: 850, duration: 0.35, type: 'sawtooth', volume: 0.18 }); noiseBurst({ duration: 0.3, volume: 0.08 }); },

    respawn() { beep({ freq: 300, freqEnd: 700, duration: 0.2, type: 'sine', volume: 0.12 }); },
  };
})();

let gadgetArmed = false;
const GADGET_COOLDOWN_SEC = 15; // server.js의 GADGET_COOLDOWN_SEC와 동일하게 유지

// 기본 공격 발사 지점(마우스 클릭, 오른쪽 조이스틱 release)이 공통으로 거치는 함수.
// 궁극기가 장전된 상태면 궁극기를, 아니면 기본 공격을 발사한다.
function fireAttack() {
  if (!joined || inCountdown()) return;
  const me = latestState.players[myId];
  if (ultimateArmed && me && me.ultimateCharge >= 100) {
    socket.emit('ultimate');
    ultimateArmed = false;
    updateUltimateButton();
    SFX.ultimate();
  } else if (gadgetArmed && me && me.gadget && !(me.gadgetCooldownLeft > 0)) {
    socket.emit('gadget');
    gadgetArmed = false;
    updateGadgetButton();
    SFX.gadget();
  } else {
    socket.emit('shoot');
    SFX.shoot();
  }
}

function setupStick(baseId, nubId, onMove, onEnd) {
  const base = document.getElementById(baseId);
  const nub = document.getElementById(nubId);
  let activeTouchId = null;

  // CSS 미디어쿼리에 따라 조이스틱 크기가 달라지므로, 매번 실제 렌더링된 크기로 최대 반경을 계산
  function getGeometry() {
    const rect = base.getBoundingClientRect();
    return {
      cx: rect.left + rect.width / 2,
      cy: rect.top + rect.height / 2,
      maxDist: rect.width / 2 - 6, // 베이스 가장자리에 살짝 여유를 둠
    };
  }

  function handleMove(clientX, clientY) {
    const { cx, cy, maxDist } = getGeometry();
    let dx = clientX - cx;
    let dy = clientY - cy;
    const dist = Math.sqrt(dx * dx + dy * dy);
    if (dist > maxDist) {
      dx = (dx / dist) * maxDist;
      dy = (dy / dist) * maxDist;
    }
    nub.style.transform = `translate(${dx}px, ${dy}px)`;
    onMove(dx / maxDist, dy / maxDist, dx, dy);
  }

  function resetNub() {
    nub.style.transform = 'translate(0px, 0px)';
  }

  base.addEventListener('touchstart', (e) => {
    e.preventDefault();
    const t = e.changedTouches[0];
    activeTouchId = t.identifier;
    base.classList.add('dragging');
    handleMove(t.clientX, t.clientY);
  }, { passive: false });

  base.addEventListener('touchmove', (e) => {
    e.preventDefault();
    for (const t of e.changedTouches) {
      if (t.identifier === activeTouchId) {
        handleMove(t.clientX, t.clientY);
      }
    }
  }, { passive: false });

  function onTouchEnd(e) {
    for (const t of e.changedTouches) {
      if (t.identifier === activeTouchId) {
        activeTouchId = null;
        base.classList.remove('dragging');
        resetNub();
        onEnd();
      }
    }
  }
  base.addEventListener('touchend', onTouchEnd, { passive: false });
  base.addEventListener('touchcancel', onTouchEnd, { passive: false });
}

setupStick('leftStick', 'leftNub',
  (nx, ny) => {
    touchMoveActive = true;
    touchMoveX = nx;
    touchMoveY = ny;
  },
  () => {
    touchMoveActive = false;
    touchMoveX = 0;
    touchMoveY = 0;
  }
);

setupStick('rightStick', 'rightNub',
  (nx, ny, dx, dy) => {
    // 아주 작은 움직임은 무시(오조준 방지)
    if (Math.abs(dx) < 4 && Math.abs(dy) < 4) return;
    touchAimActive = true;
    rightStickDragged = true;
    touchAimAngle = Math.atan2(dy, dx);
  },
  () => {
    // 손가락을 떼는 순간 마지막으로 조준한 방향으로 발사 (궁극기가 장전되어 있으면 궁극기가 나감)
    fireAttack();
    touchAimActive = false;
    rightStickDragged = false;
  }
);

// ===== 조인 처리: 닉네임 입력 -> 모드 선택 -> 캐릭터 선택 -> 매칭 대기 =====
// ===== 로그인 / 회원가입 =====
let currentProfile = null; // 서버가 알려주는 내 계정 정보 { username, coins, wins, losses, unlocked, prices }

function updateProfileUI() {
  const text = currentProfile
    ? `👤 ${currentProfile.username}  |  🪙 ${currentProfile.coins.toLocaleString()} 코인  |  🏆 ${currentProfile.wins}승 ${currentProfile.losses}패`
    : '';
  document.querySelectorAll('.profile-line').forEach((el) => { el.textContent = text; });
}

// 캐릭터의 트로피 수로 현재 등급과 다음 등급을 구한다 (등급표는 서버가 내려줌)
function rankInfo(trophies) {
  const ranks = (currentProfile && currentProfile.ranks) || [];
  let cur = ranks[0] || { name: '', icon: '', min: 0 };
  let next = null;
  for (const r of ranks) {
    if (trophies >= r.min) cur = r;
    else if (!next) next = r;
  }
  return { cur, next };
}

function isCharacterUnlocked(id) {
  return !!currentProfile && currentProfile.unlocked.includes(id);
}

function showAuthMsg(text, ok) {
  const el = document.getElementById('authMsg');
  el.textContent = text || '';
  el.classList.toggle('ok', !!ok);
}

function setAuthBusy(busy) {
  document.getElementById('loginBtn').disabled = busy;
  document.getElementById('registerBtn').disabled = busy;
}

function submitAuth(eventName) {
  const username = document.getElementById('nameInput').value.trim();
  const password = document.getElementById('pwInput').value;
  if (!username || !password) { showAuthMsg('아이디와 비밀번호를 입력하세요.'); return; }
  showAuthMsg('');
  setAuthBusy(true);
  socket.timeout(8000).emit(eventName, { username, password }, (err, res) => {
    setAuthBusy(false);
    if (err || !res) { showAuthMsg('서버 응답이 없습니다. 잠시 후 다시 시도해주세요.'); return; }
    if (!res.ok) { showAuthMsg(res.message || '요청에 실패했습니다.'); return; }
    try { localStorage.setItem('lastUsername', username); } catch (e) {}
    currentProfile = res.profile;
    document.getElementById('pwInput').value = '';
    showAuthMsg('');
    updateProfileUI();
    goToModeSelect();
  });
}

document.getElementById('loginBtn').addEventListener('click', () => submitAuth('login'));
document.getElementById('registerBtn').addEventListener('click', () => submitAuth('register'));
['nameInput', 'pwInput'].forEach((id) => {
  document.getElementById(id).addEventListener('keydown', (e) => {
    if (e.key === 'Enter') submitAuth('login');
  });
});
try {
  const lastUsername = localStorage.getItem('lastUsername');
  if (lastUsername) document.getElementById('nameInput').value = lastUsername;
} catch (e) {}

document.getElementById('logoutBtn').addEventListener('click', () => {
  socket.timeout(5000).emit('logout', (err, res) => {
    if (err || !res || !res.ok) return;
    currentProfile = null;
    updateProfileUI();
    document.getElementById('modeOverlay').style.display = 'none';
    document.getElementById('joinOverlay').style.display = 'flex';
    showAuthMsg('로그아웃되었습니다.', true);
  });
});

// 서버 연결이 끊겼다가 다시 연결되면 서버 쪽 로그인 상태가 사라지므로, 로그인 화면으로 돌려보낸다
function forceReLogin(message) {
  currentProfile = null;
  joined = false;
  ultimateArmed = false;
  gadgetArmed = false;
  updateProfileUI();
  ['modeOverlay', 'characterOverlay'].forEach((id) => { document.getElementById(id).style.display = 'none'; });
  ['matchingOverlay', 'matchResultOverlay', 'scoreboard'].forEach((id) => { document.getElementById(id).classList.remove('open'); });
  document.getElementById('joinOverlay').style.display = 'flex';
  showAuthMsg(message);
}
let hadConnection = false;
socket.on('connect', () => {
  if (hadConnection && currentProfile) forceReLogin('연결이 끊어졌습니다. 다시 로그인해주세요.');
  hadConnection = true;
});

// 매치 정산 후 서버가 보내주는 최신 코인/전적/잠금해제 정보
socket.on('profileUpdate', (data) => {
  const before = (currentProfile && currentProfile.trophies) || {};
  currentProfile = data;
  updateProfileUI();
  // 방금 끝난 매치에서 쓴 캐릭터의 트로피 증감(승리 +, 패배 -)을 결과 화면에 표시
  const id = data.lastResult && data.lastResult.characterId;
  const resultOpen = document.getElementById('matchResultOverlay').classList.contains('open');
  if (id && resultOpen) {
    const diff = ((data.trophies && data.trophies[id]) || 0) - (before[id] || 0);
    if (diff !== 0) document.getElementById('matchResultDesc').textContent += `  |  🏆 ${diff > 0 ? '+' : ''}${diff} 트로피`;
  }
});

socket.on('findMatchError', (data) => {
  document.getElementById('matchingOverlay').classList.remove('open');
  alert((data && data.message) || '매칭을 시작할 수 없습니다.');
  goToCharacterSelect();
});

let selectedMode = '1v1';

function goToModeSelect() {
  document.getElementById('joinOverlay').style.display = 'none';
  document.getElementById('modeOverlay').style.display = 'flex';
}

document.querySelectorAll('.mode-card').forEach((card) => {
  card.addEventListener('click', () => {
    selectedMode = card.getAttribute('data-mode');
    goToCharacterSelect();
  });
});

function goToCharacterSelect() {
  document.getElementById('modeOverlay').style.display = 'none';
  document.getElementById('joinOverlay').style.display = 'none';
  renderCharacterList();
  document.getElementById('characterOverlay').style.display = 'flex';
}

function renderCharacterList() {
  const list = document.getElementById('characterList');
  list.innerHTML = CHARACTERS.map((c) => {
    const owned = isCharacterUnlocked(c.id);
    const price = (currentProfile && currentProfile.prices && currentProfile.prices[c.id]) || 0;
    const canAfford = !!currentProfile && currentProfile.coins >= price;
    const trophies = (currentProfile && currentProfile.trophies && currentProfile.trophies[c.id]) || 0;
    const rk = rankInfo(trophies);
    const trophyLine = owned
      ? `<div class="trophy-line">${rk.cur.icon} ${escapeHtml(rk.cur.name)} · 🏆 ${trophies.toLocaleString()}${rk.next ? ` / ${rk.next.min.toLocaleString()}` : ' (최고 등급)'}</div>`
      : '';
    const action = owned
      ? `<button data-char-id="${c.id}">선택</button>`
      : `<button class="locked-btn" data-unlock-id="${c.id}" ${canAfford ? '' : 'disabled'}>🔒 🪙 ${price.toLocaleString()} ${canAfford ? '잠금해제' : '(코인 부족)'}</button>`;
    return `
    <div class="char-card${owned ? '' : ' locked'}">
      <div class="char-avatar" style="background:${c.color}">${escapeHtml(c.name.slice(0, 1))}</div>
      <h3>${escapeHtml(c.name)}</h3>
      ${trophyLine}
      <div class="stat-line">❤️ 체력: ${c.maxHp.toLocaleString()}</div>
      <div class="stat-line">🎯 ${escapeHtml(c.basic.name)}${c.basic.damage ? `: ${c.basic.damage.toLocaleString()}` : ''}${c.basic.desc ? ` (${escapeHtml(c.basic.desc)})` : ''}</div>
      <div class="stat-line">✨ ${escapeHtml(c.ultimate.name)}${c.ultimate.damage ? `: ${c.ultimate.damage.toLocaleString()}` : ''}${c.ultimate.desc ? ` (${escapeHtml(c.ultimate.desc)})` : ''}</div>
      ${c.gadget ? `<div class="stat-line">🔧 ${escapeHtml(c.gadget.name)}${c.gadget.desc ? ` (${escapeHtml(c.gadget.desc)})` : ''}</div>` : ''}
      ${action}
    </div>`;
  }).join('');

  list.querySelectorAll('button[data-char-id]').forEach((btn) => {
    btn.addEventListener('click', () => {
      selectedCharacterId = btn.getAttribute('data-char-id');
      doJoin();
    });
  });

  list.querySelectorAll('button[data-unlock-id]').forEach((btn) => {
    btn.addEventListener('click', () => {
      const id = btn.getAttribute('data-unlock-id');
      const c = CHARACTERS.find((x) => x.id === id);
      const price = currentProfile.prices[id];
      if (!confirm(`${c.name}을(를) 🪙 ${price} 코인으로 잠금해제할까요?`)) return;
      btn.disabled = true;
      socket.timeout(8000).emit('unlockCharacter', { characterId: id }, (err, res) => {
        if (err || !res) { alert('서버 응답이 없습니다. 잠시 후 다시 시도해주세요.'); renderCharacterList(); return; }
        if (res.profile) { currentProfile = res.profile; updateProfileUI(); }
        if (!res.ok) alert(res.message || '잠금해제에 실패했습니다.');
        renderCharacterList();
      });
    });
  });
}

let myName = 'Player';
let myTeam = null;      // 'A' 또는 'B' - matchFound에서 갱신됨
let matchMode = '1v1';  // 'matchFound'에서 서버가 알려주는 실제 매치 모드로 갱신됨
let matchWinScore = 5;  // 팀이 승리하는 데 필요한 누적 킬 수. matchFound에서 갱신됨

function doJoin() {
  myName = (currentProfile && currentProfile.username) || 'Player';
  document.getElementById('characterOverlay').style.display = 'none';
  requestMatch();
}

// 대기열에 등록 요청을 보내고 매칭 대기 화면을 띄운다
function requestMatch() {
  document.getElementById('matchResultOverlay').classList.remove('open');
  document.getElementById('matchingStatus').textContent =
    selectedMode === '2v2' ? '2:2 상대를 찾는 중입니다...' : '1:1 상대를 찾는 중입니다...';
  document.getElementById('matchingOverlay').classList.add('open');
  socket.emit('findMatch', { name: myName, characterId: selectedCharacterId, mode: selectedMode });
}

document.getElementById('cancelMatchBtn').addEventListener('click', () => {
  socket.emit('cancelFindMatch');
  document.getElementById('matchingOverlay').classList.remove('open');
  document.getElementById('modeOverlay').style.display = 'flex';
});

document.getElementById('rematchBtn').addEventListener('click', () => {
  requestMatch();
});

document.getElementById('backToMenuBtn').addEventListener('click', () => {
  document.getElementById('matchResultOverlay').classList.remove('open');
  document.getElementById('modeOverlay').style.display = 'flex';
});

socket.on('queueUpdate', (data) => {
  const waiting = data && data.waiting ? data.waiting : 1;
  const needed = data && data.needed ? data.needed : 2;
  document.getElementById('matchingStatus').textContent =
    `대기 인원 ${waiting} / ${needed}명...`;
});

// ===== 대결(VS) 화면 =====
let countdownEndsAt = 0; // 이 시각(ms) 전까지는 대결 화면 - 이동/공격/스킬 입력을 막는다
let vsTimer = null;
function inCountdown() { return Date.now() < countdownEndsAt; }

function vsCardHtml(r, isMe, side) {
  const ch = CHARACTERS.find((c) => c.id === r.characterId);
  const color = ch ? ch.color : '#777';
  const rk = rankInfo(r.trophies || 0);
  return `<div class="vs-card ${side}">
    <div class="vs-avatar" style="background:${color}">${escapeHtml((r.characterName || (ch && ch.name) || '?').slice(0, 1))}</div>
    <div class="vs-name">${escapeHtml(r.name)}${isMe ? ' (나)' : ''}</div>
    <div class="vs-char">${escapeHtml(r.characterName || (ch && ch.name) || '')}</div>
    <div class="vs-trophy">${rk.cur.icon || ''} ${escapeHtml(rk.cur.name || '')} · 🏆 ${(r.trophies || 0).toLocaleString()}</div>
  </div>`;
}

function hideVersusScreen() {
  if (vsTimer) { clearInterval(vsTimer); vsTimer = null; }
  document.getElementById('versusOverlay').classList.remove('open');
}

function showVersusScreen(data) {
  const roster = data.roster || [];
  const mine = roster.filter((r) => r.team === data.team);
  const enemy = roster.filter((r) => r.team !== data.team);
  document.getElementById('vsMySide').innerHTML =
    '<div class="vs-side-label">우리 팀</div>' + mine.map((r) => vsCardHtml(r, r.id === data.id, 'me')).join('');
  document.getElementById('vsEnemySide').innerHTML =
    '<div class="vs-side-label">상대 팀</div>' + enemy.map((r) => vsCardHtml(r, false, 'enemy')).join('');

  countdownEndsAt = Date.now() + (data.startsInMs || 0);
  const cdEl = document.getElementById('vsCountdown');
  document.getElementById('versusOverlay').classList.add('open');
  if (vsTimer) clearInterval(vsTimer);
  const tick = () => {
    const left = countdownEndsAt - Date.now();
    if (left <= 0) {
      cdEl.textContent = 'START!';
      clearInterval(vsTimer); vsTimer = null;
      setTimeout(() => { if (!vsTimer) document.getElementById('versusOverlay').classList.remove('open'); }, 400);
      return;
    }
    cdEl.textContent = Math.ceil(left / 1000);
  };
  tick();
  vsTimer = setInterval(tick, 100);
}

// 상대(들)가 정해지면 매치가 시작된다: 대기 화면을 닫고 새 아레나 상태로 게임 화면을 초기화
socket.on('matchFound', (data) => {
  myId = data.id;
  myTeam = data.team;
  matchMode = data.mode || '1v1';
  matchWinScore = data.winScore || 5;
  ARENA_WIDTH = data.arena.width;
  ARENA_HEIGHT = data.arena.height;
  PLAYER_RADIUS = data.playerRadius;
  WALLS = data.walls || [];
  BUSHES = data.bushes || [];
  resizeCanvas(); // 캔버스는 맵 크기가 아니라 화면 크기에 맞춤 (카메라가 그 안에서 맵을 비춤)
  // 서버로부터 실제 스폰 좌표를 받기 전까지 잠시 쓰이는 임시값 (아래 state 핸들러가 곧바로 덮어씀)
  myX = ARENA_WIDTH / 2;
  myY = ARENA_HEIGHT / 2;

  // 이전 매치의 흔적(채팅, 상태)을 정리하고 새 매치를 시작
  chatMessages = [];
  chatBubbles = {};
  renderChatLog();
  latestState = { players: {}, bullets: [], effects: [], waterPools: [], turrets: [], bombs: [], chickens: [] };
  wasAlive = false; // 새 매치이므로, 첫 상태 수신 시 서버 스폰 위치로 무조건 동기화되게 함
  prevMyHp = null; // 새 매치 시작 시 이전 매치의 체력/점수 기록으로 인한 오작동(사운드 오재생) 방지
  prevMyScore = null;
  prevUltimateReady = false;

  document.getElementById('matchingOverlay').classList.remove('open');
  document.getElementById('matchResultOverlay').classList.remove('open');
  document.getElementById('scoreboard').classList.add('open'); // 바로 전적을 보여줌

  // 매치 시작 안내를 시스템 메시지로 채팅창에 표시
  if (matchMode === '2v2') {
    const teammate = (data.teammateNames && data.teammateNames[0]) || '??';
    const opponents = (data.opponentNames || []).join(', ') || '??';
    addChatMessage({ id: 'system', name: '시스템', color: '#f1c40f', text: `팀원: ${teammate} / 상대: ${opponents}` });
  } else {
    const opponent = (data.opponentNames && data.opponentNames[0]) || '??';
    addChatMessage({ id: 'system', name: '시스템', color: '#f1c40f', text: `상대: ${opponent}` });
  }

  joined = true;
  showVersusScreen(data); // 상대 캐릭터/트로피를 보여주고 카운트다운 후 시작
  canvas.focus();

  const mobileHintEl = document.getElementById('mobileHint');
  if (mobileHintEl) {
    mobileHintEl.style.opacity = '1';
    setTimeout(() => { mobileHintEl.style.opacity = '0'; }, 5000);
  }

  SFX.matchStart();
});

// 매치가 끝나면(승리/패배/상대 이탈) 결과 화면을 보여준다
socket.on('matchOver', (data) => {
  joined = false;
  countdownEndsAt = 0;
  hideVersusScreen();
  ultimateArmed = false;
  gadgetArmed = false;

  const titleEl = document.getElementById('matchResultTitle');
  const descEl = document.getElementById('matchResultDesc');
  const iWon = data.winnerTeam === myTeam;
  const ts = data.teamScore || { A: 0, B: 0 };
  const myScore = myTeam === 'A' ? ts.A : ts.B;
  const oppScore = myTeam === 'A' ? ts.B : ts.A;

  titleEl.classList.remove('win', 'lose');
  if (data.reason === 'opponentLeft') {
    titleEl.textContent = iWon ? '상대가 나갔습니다' : '매치 종료';
    titleEl.classList.add(iWon ? 'win' : 'lose');
    descEl.textContent = '상대방의 연결이 끊어져 매치가 종료되었습니다.';
  } else {
    titleEl.textContent = iWon ? '승리!' : '패배';
    titleEl.classList.add(iWon ? 'win' : 'lose');
    descEl.textContent = `${myScore} : ${oppScore} (${matchWinScore}킬 선취)`;
  }

  if (iWon && data.coinReward) descEl.textContent += `  |  🪙 +${data.coinReward} 코인`;

  document.getElementById('matchResultOverlay').classList.add('open');

  if (iWon) SFX.win(); else SFX.lose();
});

// 마지막으로 확인된 '생존' 여부. 참가 직후(false)나 리스폰 직후(죽음->생존 전환)에
// 로컬 이동 좌표(myX, myY)를 서버가 정해준 실제 위치로 강제 동기화하기 위해 사용.
// 이 동기화가 없으면 로컬 좌표가 초기값(맵 정중앙)에 머물러 있다가, 그 위치가
// 벽과 겹칠 경우 "시작하자마자 벽에 낀 것처럼" 전혀 움직이지 못하는 문제가 생김.
let wasAlive = false;

// 효과음 트리거용 - 직전 상태에서의 내 체력/점수/궁극기 게이지를 기억해뒀다가 변화를 비교한다
let prevMyHp = null;
let prevMyScore = null;
let prevUltimateReady = false;

socket.on('state', (state) => {
  latestState = state;
  const me = state.players[myId];
  if (me) {
    if (!me.alive) {
      // 사망 중에는 서버 위치를 계속 따라간다
      myX = me.x;
      myY = me.y;
    } else if (!wasAlive) {
      // 방금 참가했거나 리스폰된 순간 -> 서버가 정한 스폰 위치로 강제 동기화
      myX = me.x;
      myY = me.y;
      if (prevMyHp !== null) SFX.respawn(); // 최초 참가 시점(prevMyHp === null)에는 재생하지 않음
    }

    // 방금 죽었을 때(생존 -> 사망 전환)
    if (wasAlive && !me.alive) SFX.death();
    // 체력이 줄었을 때(공격당함). 사망으로 인한 감소는 위에서 이미 별도 처리하므로 살아있을 때만
    else if (me.alive && prevMyHp !== null && me.hp < prevMyHp) SFX.hit();

    // 처치 수(score)가 늘었을 때
    if (prevMyScore !== null && me.score > prevMyScore) SFX.kill();

    // 궁극기 게이지가 이번에 막 100%가 되었을 때
    const ultimateReady = me.ultimateCharge >= 100;
    if (ultimateReady && !prevUltimateReady) SFX.ultimateReady();
    prevUltimateReady = ultimateReady;

    prevMyHp = me.hp;
    prevMyScore = me.score;
    wasAlive = me.alive;
  }
  updateUltimateButton();
  updateGadgetButton();
  updateAmmoDisplay();
});

// ===== 스코어보드 (동그란 버튼을 눌러야 보이게 토글) =====
const scoreboardToggleBtn = document.getElementById('scoreboardToggleBtn');
const scoreboardEl = document.getElementById('scoreboard');
scoreboardToggleBtn.addEventListener('click', () => {
  scoreboardEl.classList.toggle('open');
});

// ===== 채팅 =====
const chatLogEl = document.getElementById('chatLog');
const chatInputEl = document.getElementById('chatInput');
const chatToggleBtn = document.getElementById('chatToggleBtn');

let chatMessages = [];
const CHAT_MAX_MESSAGES = 50;     // 로그에 남기는 최대 메시지 수
const CHAT_BUBBLE_DURATION = 4000; // 캐릭터 머리 위 말풍선 표시 시간(ms)
let chatBubbles = {}; // { [playerId]: { text, expiresAt } }

function isChatFocused() {
  return document.activeElement === chatInputEl;
}

function openChatInput() {
  if (!joined) return;
  chatInputEl.classList.add('active');
  chatInputEl.focus();
}

function closeChatInput() {
  chatInputEl.classList.remove('active');
  chatInputEl.value = '';
  chatInputEl.blur();
  canvas.focus();
}

chatToggleBtn.addEventListener('click', () => {
  if (isChatFocused()) closeChatInput();
  else openChatInput();
});

chatInputEl.addEventListener('keydown', (e) => {
  e.stopPropagation(); // 게임 이동/궁극기 키 핸들러로 전파되지 않도록 차단
  if (e.key === 'Enter') {
    const text = chatInputEl.value.trim();
    if (text) socket.emit('chatMessage', { text });
    closeChatInput();
  } else if (e.key === 'Escape') {
    closeChatInput();
  }
});

// Enter로 채팅창 열기 (다른 입력 중이 아닐 때만)
window.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && joined && !isChatFocused()) {
    e.preventDefault();
    openChatInput();
  }
});

function addChatMessage(msg) {
  chatMessages.push(msg);
  if (chatMessages.length > CHAT_MAX_MESSAGES) chatMessages.shift();
  renderChatLog();
  chatBubbles[msg.id] = { text: msg.text, expiresAt: Date.now() + CHAT_BUBBLE_DURATION };
}

function renderChatLog() {
  chatLogEl.innerHTML = chatMessages.map((m) => (
    `<div class="chat-line"><span class="chat-name" style="color:${m.color || '#fff'}">${escapeHtml(m.name)}:</span>${escapeHtml(m.text)}</div>`
  )).join('');
  chatLogEl.scrollTop = chatLogEl.scrollHeight;
}

function drawChatBubble(p) {
  const bubble = chatBubbles[p.id];
  if (!bubble) return;
  if (Date.now() > bubble.expiresAt) { delete chatBubbles[p.id]; return; }

  ctx.save();
  ctx.font = '12px sans-serif';
  const paddingX = 9, bh = 22;
  const textWidth = ctx.measureText(bubble.text).width;
  const bw = textWidth + paddingX * 2;
  const bx = p.x - bw / 2;
  const by = p.y - PLAYER_RADIUS - 44 - bh;

  ctx.fillStyle = 'rgba(0,0,0,0.7)';
  ctx.beginPath();
  if (ctx.roundRect) ctx.roundRect(bx, by, bw, bh, 8);
  else ctx.rect(bx, by, bw, bh);
  ctx.fill();

  ctx.fillStyle = '#fff';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(bubble.text, p.x, by + bh / 2);
  ctx.restore();
}

socket.on('chatMessage', (msg) => {
  addChatMessage(msg);
});

// ===== 키보드 입력 =====
window.addEventListener('keydown', (e) => {
  if (isChatFocused()) return; // 채팅 입력 중에는 이동키 무시
  switch (e.key) {
    case 'w': case 'W': case 'ArrowUp': keys.up = true; break;
    case 's': case 'S': case 'ArrowDown': keys.down = true; break;
    case 'a': case 'A': case 'ArrowLeft': keys.left = true; break;
    case 'd': case 'D': case 'ArrowRight': keys.right = true; break;
  }
});
window.addEventListener('keyup', (e) => {
  switch (e.key) {
    case 'w': case 'W': case 'ArrowUp': keys.up = false; break;
    case 's': case 'S': case 'ArrowDown': keys.down = false; break;
    case 'a': case 'A': case 'ArrowLeft': keys.left = false; break;
    case 'd': case 'D': case 'ArrowRight': keys.right = false; break;
  }
});

// ===== 마우스 입력 =====
// 캔버스가 CSS로 축소/확대되어 표시될 수 있으므로 내부 해상도 기준으로 좌표 보정
canvas.addEventListener('mousemove', (e) => {
  const rect = canvas.getBoundingClientRect();
  const scaleX = canvas.width / rect.width;
  const scaleY = canvas.height / rect.height;
  mouseX = (e.clientX - rect.left) * scaleX;
  mouseY = (e.clientY - rect.top) * scaleY;
});
canvas.addEventListener('mousedown', (e) => {
  if (isTouchDevice) return; // 모바일은 오른쪽 조이스틱으로만 발사 (캔버스 탭에 의한 오발사 방지)
  if (e.button === 0 && joined) {
    fireAttack();
  }
});

// ===== 궁극기 =====
// 조준이 필요 없는 궁극기(예: 벼락지기)는 누르는 즉시 발동.
// 조준이 필요한 궁극기(예: 피에로 발사)는 '장전' 상태로 전환되고,
// 이후 기본 공격 입력(마우스 클릭 / 오른쪽 조이스틱)으로 조준해서 발사한다.
function activateUltimateControl() {
  if (!joined || inCountdown()) return;
  const me = latestState.players[myId];
  if (!me || !me.alive) return;
  if (me.ultimateCharge < 100) return;

  if (me.ultimate && me.ultimate.type === 'lightning') {
    socket.emit('ultimate');
    ultimateArmed = false;
    SFX.ultimate();
  } else {
    ultimateArmed = !ultimateArmed; // 다시 누르면 장전 취소
    if (ultimateArmed) gadgetArmed = false; // 궁극기와 가젯은 동시에 장전할 수 없음
  }
  updateUltimateButton();
}

document.getElementById('ultimateButton').addEventListener('pointerdown', (e) => {
  e.preventDefault();
  activateUltimateControl();
});

window.addEventListener('keydown', (e) => {
  if (isChatFocused()) return; // 채팅 입력 중에는 궁극기 단축키 무시
  if (e.key === 'e' || e.key === 'E') activateUltimateControl();
});

// ===== 가젯 =====
// 조준이 필요한 가젯(예: 연발 사격)은 '장전' 상태로 전환되고, 이후 기본 공격 입력으로 발사한다.
// 조준이 필요 없는 가젯(instant, 예: 탄창 충전)은 누르는 즉시 발동한다.
function activateGadgetControl() {
  if (!joined || inCountdown()) return;
  const me = latestState.players[myId];
  if (!me || !me.alive || !me.gadget) return;
  if (me.gadgetCooldownLeft > 0) return;

  if (me.gadget.instant) {
    socket.emit('gadget');
    gadgetArmed = false;
    SFX.gadget();
  } else {
    gadgetArmed = !gadgetArmed; // 다시 누르면 장전 취소
    if (gadgetArmed) ultimateArmed = false; // 궁극기와 가젯은 동시에 장전할 수 없음
  }
  updateGadgetButton();
  updateUltimateButton();
}

document.getElementById('gadgetButton').addEventListener('pointerdown', (e) => {
  e.preventDefault();
  activateGadgetControl();
});

window.addEventListener('keydown', (e) => {
  if (isChatFocused()) return; // 채팅 입력 중에는 가젯 단축키 무시
  if (e.key === 'f' || e.key === 'F') activateGadgetControl();
});

function updateGadgetButton() {
  const btn = document.getElementById('gadgetButton');
  const me = latestState.players[myId];
  const hasGadget = !!(joined && me && me.gadget);
  btn.style.display = hasGadget ? 'flex' : 'none';
  if (!hasGadget) { gadgetArmed = false; return; }

  const left = me.gadgetCooldownLeft || 0;
  if (left > 0 || !me.alive) gadgetArmed = false; // 쿨다운 중이거나 사망 시 장전 불가
  const progress = Math.round((1 - left / GADGET_COOLDOWN_SEC) * 100);
  btn.style.background = `conic-gradient(#003580 ${progress}%, rgba(255,255,255,0.15) ${progress}%)`;
  btn.classList.toggle('ready', left <= 0);
  btn.classList.toggle('armed', gadgetArmed);
  btn.querySelector('.gad-cd').textContent = left > 0 ? String(Math.ceil(left)) : '';
}

function updateUltimateButton() {
  const btn = document.getElementById('ultimateButton');
  const me = latestState.players[myId];
  const charge = me ? me.ultimateCharge : 0;
  if (charge < 100) ultimateArmed = false; // 게이지가 다 차지 않은 상태면 장전 불가(사망/리스폰 등)
  btn.style.background = `conic-gradient(#f1c40f ${charge}%, rgba(255,255,255,0.15) ${charge}%)`;
  btn.classList.toggle('ready', charge >= 100);
  btn.classList.toggle('armed', ultimateArmed);
}

function updateAmmoDisplay() {
  const me = latestState.players[myId];
  const ammo = me ? me.ammo : 3;
  const maxAmmo = me ? me.maxAmmo : 3;
  for (let i = 0; i < maxAmmo; i++) {
    const dot = document.getElementById('ammoDot' + i);
    if (dot) dot.classList.toggle('empty', i >= ammo);
  }
}

// ===== 벽 충돌 (서버와 동일한 방식으로 클라이언트에서도 미리 계산해 부드럽게 이동) =====
function circleIntersectsRect(cx, cy, radius, rect) {
  const closestX = Math.max(rect.x, Math.min(cx, rect.x + rect.width));
  const closestY = Math.max(rect.y, Math.min(cy, rect.y + rect.height));
  const dx = cx - closestX;
  const dy = cy - closestY;
  return (dx * dx + dy * dy) < (radius * radius);
}

function collidesWithWalls(x, y, radius) {
  return WALLS.some((w) => circleIntersectsRect(x, y, radius, w));
}

// ===== 게임 루프 (클라이언트) =====
let lastTime = performance.now();

function update(dt) {
  if (!joined) return;
  if (inCountdown()) { // 대결 화면 중에는 이동 불가 - 서버가 정해준 시작 위치에 고정
    const m0 = latestState.players[myId];
    if (m0) { myX = m0.x; myY = m0.y; }
    return;
  }
  const me = latestState.players[myId];
  if (me && !me.alive) return; // 사망 중에는 이동 불가
  if (me && (me.dashing || (me.stunnedUntil && Date.now() < me.stunnedUntil) || (me.knockbackTimeLeft && me.knockbackTimeLeft > 0))) {
    // 돌진 중이거나 기절/넉백 상태면 서버가 위치를 직접 제어하므로, 로컬 입력을 무시하고 서버 위치를 그대로 따라간다
    myX = me.x;
    myY = me.y;
    return;
  }

  let dx = 0, dy = 0;
  if (keys.up) dy -= 1;
  if (keys.down) dy += 1;
  if (keys.left) dx -= 1;
  if (keys.right) dx += 1;

  // 왼쪽 가상 조이스틱 입력 반영 (키보드와 동시 사용 시 합쳐짐)
  if (touchMoveActive) {
    dx += touchMoveX;
    dy += touchMoveY;
  }

  const len = Math.sqrt(dx * dx + dy * dy);
  if (len > 0.01) {
    // 조이스틱은 아날로그 값(0~1)이므로 그대로, 키보드(1 또는 √2)는 1로 눌러서 사용
    const magnitude = Math.min(1, len);
    // 보배 폭탄 범위 등에 들어가 있으면 서버가 내려주는 speedMultiplier만큼 이동속도가 느려짐
    const speedMultiplier = (me && typeof me.speedMultiplier === 'number') ? me.speedMultiplier : 1;
    const nextX = myX + (dx / len) * magnitude * MOVE_SPEED * speedMultiplier * dt;
    const nextY = myY + (dy / len) * magnitude * MOVE_SPEED * speedMultiplier * dt;

    // 벽에 닿아도 옆으로는 미끄러지듯 이동하도록 축별로 검사
    if (!collidesWithWalls(nextX, myY, PLAYER_RADIUS)) myX = nextX;
    if (!collidesWithWalls(myX, nextY, PLAYER_RADIUS)) myY = nextY;
  }

  myX = Math.max(PLAYER_RADIUS, Math.min(ARENA_WIDTH - PLAYER_RADIUS, myX));
  myY = Math.max(PLAYER_RADIUS, Math.min(ARENA_HEIGHT - PLAYER_RADIUS, myY));

  // 오른쪽 조이스틱으로 조준 중이면 그 방향을, 아니면 마우스 방향을 바라봄
  // mouseX/mouseY는 화면(캔버스) 기준 좌표이므로, 축소 배율을 나누고 카메라 오프셋을 더해 월드 좌표로 변환한 뒤 각도를 계산
  myAngle = touchAimActive ? touchAimAngle : Math.atan2((mouseY / cameraScale + camera.y) - myY, (mouseX / cameraScale + camera.x) - myX);

  socket.emit('playerUpdate', { x: myX, y: myY, angle: myAngle });
}

function drawPlayer(p, isMe) {
  // 몸통
  ctx.save();
  ctx.translate(p.x, p.y);

  if (!p.alive) {
    ctx.globalAlpha = 0.25; // 사망 상태는 반투명 처리
  } else if (p.invisible) {
    ctx.globalAlpha = 0.45; // 은신 중임을 자신/아군에게 시각적으로 알려줌 (적에게는 애초에 좌표가 전달되지 않음)
  }

  // 팀 구분 링 (A팀=파랑, B팀=빨강) - 본체 바깥쪽에 얇게 표시해 누가 아군/적군인지 한눈에 보이게 함
  if (p.team) {
    ctx.beginPath();
    ctx.arc(0, 0, PLAYER_RADIUS + 5, 0, Math.PI * 2);
    ctx.strokeStyle = p.team === 'A' ? '#5dade2' : '#ec7063';
    ctx.lineWidth = 3;
    ctx.stroke();
  }

  ctx.beginPath();
  ctx.arc(0, 0, PLAYER_RADIUS, 0, Math.PI * 2);
  ctx.fillStyle = p.color || '#3498db';
  ctx.fill();
  ctx.lineWidth = isMe ? 3 : 1.5;
  ctx.strokeStyle = isMe ? '#fff' : '#222';
  ctx.stroke();


  // 바라보는 방향 표시
  ctx.rotate(p.angle);
  ctx.beginPath();
  ctx.moveTo(0, 0);
  ctx.lineTo(PLAYER_RADIUS + 10, 0);
  ctx.strokeStyle = '#fff';
  ctx.lineWidth = 3;
  ctx.stroke();

  ctx.restore();
  ctx.globalAlpha = 1;

  if (!p.alive) return; // 사망 중에는 이름/HP 표시 생략

  // 닉네임
  ctx.font = 'bold 13px sans-serif';
  ctx.textAlign = 'center';
  ctx.fillStyle = '#fff';
  ctx.fillText(p.name, p.x, p.y - PLAYER_RADIUS - 22);

  // 무적 상태 표시 (슈의 가젯): 몸 주변에 반짝이는 보호막
  if (p.invincibleUntil && Date.now() < p.invincibleUntil) {
    const pulse = 0.5 + 0.5 * Math.sin(Date.now() / 90);
    ctx.save();
    ctx.beginPath();
    ctx.arc(p.x, p.y, PLAYER_RADIUS + 8, 0, Math.PI * 2);
    ctx.fillStyle = `rgba(255, 235, 120, ${0.18 + 0.12 * pulse})`;
    ctx.fill();
    ctx.lineWidth = 3;
    ctx.strokeStyle = `rgba(255, 215, 0, ${0.7 + 0.3 * pulse})`;
    ctx.stroke();
    ctx.restore();
  }

  // 기절 상태 표시 (변기 돌진 등에 맞았을 때) / 충전 중 표시 (보배의 가젯)
  if (p.chargingUntil && Date.now() < p.chargingUntil) {
    ctx.font = `${PLAYER_RADIUS}px sans-serif`;
    ctx.fillText('🔋', p.x, p.y - PLAYER_RADIUS - 34);
  } else if (p.stunnedUntil && Date.now() < p.stunnedUntil) {
    ctx.font = `${PLAYER_RADIUS}px sans-serif`;
    ctx.fillText('💫', p.x, p.y - PLAYER_RADIUS - 34);
  }

  // 가젯 효과 표시: 이동속도 증가(원효대사) / 공격력 증가(보배)
  {
    const nowMs = Date.now();
    ctx.font = `${Math.round(PLAYER_RADIUS * 0.8)}px sans-serif`;
    if (p.speedBoostUntil && nowMs < p.speedBoostUntil) {
      ctx.fillText('💨', p.x - PLAYER_RADIUS - 6, p.y);
    }
    if (p.damageBoostUntil && nowMs >= p.damageBoostFrom && nowMs < p.damageBoostUntil) {
      ctx.fillText('🔥', p.x, p.y - PLAYER_RADIUS - 34);
    }
  }

  // HP 바
  const barW = 44, barH = 6;
  const hpRatio = Math.max(0, p.hp / (p.maxHp || 100));
  ctx.fillStyle = '#555';
  ctx.fillRect(p.x - barW / 2, p.y - PLAYER_RADIUS - 16, barW, barH);
  ctx.fillStyle = hpRatio > 0.5 ? '#2ecc71' : hpRatio > 0.2 ? '#f1c40f' : '#e74c3c';
  ctx.fillRect(p.x - barW / 2, p.y - PLAYER_RADIUS - 16, barW * hpRatio, barH);
}

function drawBullet(b) {
  if (b.visual === 'clown') {
    // 피에로 발사 궁극기 - 크고 화려한 총알
    ctx.save();
    ctx.beginPath();
    ctx.arc(b.x, b.y, b.radius, 0, Math.PI * 2);
    ctx.fillStyle = '#e74c3c';
    ctx.fill();
    ctx.font = `${b.radius * 1.6}px sans-serif`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText('🤡', b.x, b.y + 1);
    ctx.restore();
    return;
  }

  if (b.visual === 'orb') {
    // 던지기 - 총알보다 크고 느린 구체
    ctx.save();
    const gradient = ctx.createRadialGradient(b.x - b.radius * 0.3, b.y - b.radius * 0.3, 1, b.x, b.y, b.radius);
    gradient.addColorStop(0, '#a8f0d1');
    gradient.addColorStop(1, '#16a085');
    ctx.beginPath();
    ctx.arc(b.x, b.y, b.radius, 0, Math.PI * 2);
    ctx.fillStyle = gradient;
    ctx.fill();
    ctx.lineWidth = 1.5;
    ctx.strokeStyle = 'rgba(255,255,255,0.6)';
    ctx.stroke();
    ctx.restore();
    return;
  }

  if (b.visual === 'slug') {
    // 메가 샷건 - 크고 묵직한 산탄
    ctx.save();
    const gradient = ctx.createRadialGradient(b.x - b.radius * 0.3, b.y - b.radius * 0.3, 1, b.x, b.y, b.radius);
    gradient.addColorStop(0, '#ffe08a');
    gradient.addColorStop(1, '#d35400');
    ctx.beginPath();
    ctx.arc(b.x, b.y, b.radius, 0, Math.PI * 2);
    ctx.fillStyle = gradient;
    ctx.fill();
    ctx.lineWidth = 1.5;
    ctx.strokeStyle = 'rgba(255,255,255,0.6)';
    ctx.stroke();
    ctx.restore();
    return;
  }

  if (b.visual === 'skull') {
    // 해골물 뿌리기 - 벽/적에 닿으면 물웅덩이를 남기는 해골 투사체
    ctx.save();
    ctx.beginPath();
    ctx.arc(b.x, b.y, b.radius, 0, Math.PI * 2);
    ctx.fillStyle = '#ecf0f1';
    ctx.fill();
    ctx.lineWidth = 1.5;
    ctx.strokeStyle = 'rgba(80,80,80,0.8)';
    ctx.stroke();
    ctx.font = `${b.radius * 1.7}px sans-serif`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText('💀', b.x, b.y + 1);
    ctx.restore();
    return;
  }

  if (b.visual === 'knife') {
    // 성스럽다의 칼 던지기 - 날아가는 방향으로 회전한 칼 (벽을 통과해서 날아감)
    ctx.save();
    ctx.translate(b.x, b.y);
    ctx.rotate(Math.atan2(b.vy || 0, b.vx || 1));
    ctx.font = `${b.radius * 2.4}px sans-serif`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText('🔪', 0, 1);
    ctx.restore();
    return;
  }

  if (b.visual === 'sniperBullet') {
    // 저격 터렛이 발사하는 총알 - 빠른 속도를 표현하기 위해 진행 방향 반대쪽으로 짧은 궤적을 남김
    ctx.save();
    const angle = Math.atan2(b.vy || 0, b.vx || 1);
    const trailLen = 22;
    const gradient = ctx.createLinearGradient(
      b.x - Math.cos(angle) * trailLen, b.y - Math.sin(angle) * trailLen,
      b.x, b.y
    );
    gradient.addColorStop(0, 'rgba(231, 76, 60, 0)');
    gradient.addColorStop(1, 'rgba(231, 76, 60, 0.9)');
    ctx.strokeStyle = gradient;
    ctx.lineWidth = b.radius;
    ctx.beginPath();
    ctx.moveTo(b.x - Math.cos(angle) * trailLen, b.y - Math.sin(angle) * trailLen);
    ctx.lineTo(b.x, b.y);
    ctx.stroke();

    ctx.beginPath();
    ctx.arc(b.x, b.y, b.radius, 0, Math.PI * 2);
    ctx.fillStyle = '#e74c3c';
    ctx.fill();
    ctx.restore();
    return;
  }

  if (b.visual === 'egg') {
    // 엑헤의 계란 던지기 - 깨지면 흰자가 퍼지는 계란
    ctx.save();
    ctx.beginPath();
    ctx.arc(b.x, b.y, b.radius, 0, Math.PI * 2);
    ctx.fillStyle = '#fdf6e3';
    ctx.fill();
    ctx.lineWidth = 1.5;
    ctx.strokeStyle = 'rgba(200,160,80,0.9)';
    ctx.stroke();
    ctx.font = `${b.radius * 1.7}px sans-serif`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText('🥚', b.x, b.y + 1);
    ctx.restore();
    return;
  }

  if (b.visual === 'poop') {
    // 여똥이의 똥가루 뿌리기 - 벽/적에 닿으면 독가스(똥가루) 구름을 남기는 발사체
    ctx.save();
    ctx.beginPath();
    ctx.arc(b.x, b.y, b.radius, 0, Math.PI * 2);
    ctx.fillStyle = '#8e5a2d';
    ctx.fill();
    ctx.font = `${b.radius * 1.7}px sans-serif`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText('💩', b.x, b.y + 1);
    ctx.restore();
    return;
  }

  if (b.visual === 'bobae') {
    // 보배 던지기 - 반짝이는 보배(구슬) 투척
    ctx.save();
    const gradient = ctx.createRadialGradient(b.x - b.radius * 0.3, b.y - b.radius * 0.3, 1, b.x, b.y, b.radius);
    gradient.addColorStop(0, '#ffd1e8');
    gradient.addColorStop(1, '#d63384');
    ctx.beginPath();
    ctx.arc(b.x, b.y, b.radius, 0, Math.PI * 2);
    ctx.fillStyle = gradient;
    ctx.fill();
    ctx.lineWidth = 1.5;
    ctx.strokeStyle = 'rgba(255,255,255,0.7)';
    ctx.stroke();
    ctx.restore();
    return;
  }

  // 기본 총알
  ctx.beginPath();
  ctx.arc(b.x, b.y, b.radius, 0, Math.PI * 2);
  ctx.fillStyle = '#f39c12';
  ctx.fill();
}

// 성스럽다의 저격 터렛 - 팀 색 링 + 체력바가 있는 고정 설치물
function drawTurret(t) {
  // 내 팀(자신/아군)의 터렛은 초록색, 적군의 터렛은 빨간색으로 구분 (물웅덩이와 같은 규칙)
  const isAlly = t.ownerId === myId || (myTeam && t.team === myTeam);
  const ringColor = isAlly ? '#2ecc71' : '#e74c3c';
  const bodyColor = isAlly ? '#1e6b45' : '#7b241c';
  const glowColor = isAlly ? 'rgba(46, 204, 113, 0.28)' : 'rgba(231, 76, 60, 0.28)';

  ctx.save();
  ctx.translate(t.x, t.y);

  // 바닥에 깔리는 은은한 팀 색 발광 (멀리서도 아군/적군이 한눈에 보이도록)
  ctx.beginPath();
  ctx.arc(0, 0, t.radius + 12, 0, Math.PI * 2);
  ctx.fillStyle = glowColor;
  ctx.fill();

  // 팀 구분 링
  ctx.beginPath();
  ctx.arc(0, 0, t.radius + 5, 0, Math.PI * 2);
  ctx.strokeStyle = ringColor;
  ctx.lineWidth = 3;
  ctx.stroke();

  ctx.beginPath();
  ctx.arc(0, 0, t.radius, 0, Math.PI * 2);
  ctx.fillStyle = bodyColor;
  ctx.fill();
  ctx.lineWidth = 2;
  ctx.strokeStyle = ringColor;
  ctx.stroke();

  ctx.font = `${t.radius * 1.5}px sans-serif`;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText('🎯', 0, 1);
  ctx.restore();

  // HP 바
  const barW = 48, barH = 6;
  const hpRatio = Math.max(0, t.hp / (t.maxHp || 1));
  ctx.fillStyle = '#555';
  ctx.fillRect(t.x - barW / 2, t.y - t.radius - 14, barW, barH);
  ctx.fillStyle = hpRatio > 0.5 ? '#2ecc71' : hpRatio > 0.2 ? '#f1c40f' : '#e74c3c';
  ctx.fillRect(t.x - barW / 2, t.y - t.radius - 14, barW * hpRatio, barH);
}

// 보배 폭발 설치물 - 터질 때까지 남은 시간에 맞춰 점점 빠르게 깜빡이는 위험 범위 표시
function drawBomb(bomb) {
  ctx.save();
  const pulse = 0.5 + 0.5 * Math.sin(Date.now() / Math.max(60, bomb.fuseLeft * 120));
  ctx.globalAlpha = 0.18 + pulse * 0.18;
  ctx.beginPath();
  ctx.arc(bomb.x, bomb.y, bomb.radius, 0, Math.PI * 2);
  ctx.fillStyle = '#ff4d6d';
  ctx.fill();
  ctx.globalAlpha = 0.9;
  ctx.lineWidth = 2;
  ctx.setLineDash([6, 6]);
  ctx.strokeStyle = '#ff4d6d';
  ctx.stroke();
  ctx.setLineDash([]);
  ctx.font = '22px sans-serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText('💣', bomb.x, bomb.y);
  ctx.restore();
}

// 지속 지형 효과: 원효대사의 물웅덩이(적 대미지 + 아군 회복) / 여똥이의 똥가루 구름(적에게만 대미지)
// 엑헤의 계란 흰자: 깨진 계란이 퍼진 웅덩이 (적에게만 대미지)
function drawEggWhite(pool) {
  const isAlly = pool.ownerId === myId || (myTeam && pool.team === myTeam);
  const stroke = isAlly ? 'rgba(46, 204, 113, 1)' : 'rgba(231, 76, 60, 1)';
  ctx.save();
  const alpha = Math.max(0.2, Math.min(0.75, pool.life + 0.2));
  ctx.globalAlpha = alpha;
  const gradient = ctx.createRadialGradient(pool.x, pool.y, 1, pool.x, pool.y, pool.radius);
  gradient.addColorStop(0, 'rgba(255, 220, 90, 0.95)');   // 노른자 느낌의 중심
  gradient.addColorStop(0.25, 'rgba(255, 255, 255, 0.95)');
  gradient.addColorStop(1, 'rgba(235, 240, 235, 0.55)');
  ctx.beginPath();
  ctx.arc(pool.x, pool.y, pool.radius, 0, Math.PI * 2);
  ctx.fillStyle = gradient;
  ctx.fill();
  ctx.globalAlpha = Math.min(1, alpha + 0.3);
  ctx.lineWidth = 3;
  ctx.strokeStyle = stroke;
  ctx.stroke();
  ctx.font = `${Math.min(30, pool.radius * 0.4)}px sans-serif`;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText('🍳', pool.x, pool.y);
  ctx.restore();
}

// 엑헤의 닭 (궁극기로 소환된 자동 추격 유닛)
function drawChicken(c) {
  const isAlly = c.ownerId === myId || (myTeam && c.team === myTeam);
  const peck = c.peckTimer > 0 ? 4 : 0; // 쪼는 순간 살짝 튀어나오는 연출
  ctx.save();
  ctx.translate(c.x, c.y + peck);
  ctx.beginPath();
  ctx.arc(0, 0, c.radius + 4, 0, Math.PI * 2);
  ctx.strokeStyle = isAlly ? '#2ecc71' : '#e74c3c';
  ctx.lineWidth = 3;
  ctx.stroke();
  ctx.beginPath();
  ctx.arc(0, 0, c.radius, 0, Math.PI * 2);
  ctx.fillStyle = '#fff8e1';
  ctx.fill();
  ctx.font = `${c.radius * 1.7}px sans-serif`;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText('🐔', 0, 1);
  ctx.restore();

  const barW = 40, barH = 5;
  const hpRatio = Math.max(0, c.hp / (c.maxHp || 1));
  ctx.fillStyle = '#555';
  ctx.fillRect(c.x - barW / 2, c.y - c.radius - 14, barW, barH);
  ctx.fillStyle = hpRatio > 0.5 ? '#2ecc71' : hpRatio > 0.2 ? '#f1c40f' : '#e74c3c';
  ctx.fillRect(c.x - barW / 2, c.y - c.radius - 14, barW * hpRatio, barH);
}

function drawWaterPool(pool) {
  if (pool.visual === 'eggWhite') { drawEggWhite(pool); return; }
  const isPoisonGas = !pool.heal; // heal이 0(또는 없음)이면 회복 효과가 없는 독가스 구름(똥가루)으로 간주
  // 내 팀(자신/아군)이 만든 원은 초록색, 적군이 만든 원은 빨간색으로 구분
  const isAlly = pool.ownerId === myId || (myTeam && pool.team === myTeam);
  const inner = isAlly ? '#82e0aa' : '#f1948a';
  const outer = isAlly ? '#1e8449' : '#b03a2e';
  const stroke = isAlly ? 'rgba(46, 204, 113, 1)' : 'rgba(231, 76, 60, 1)';
  ctx.save();
  const alpha = Math.max(0.15, Math.min(0.55, pool.life));
  ctx.globalAlpha = alpha;
  const gradient = ctx.createRadialGradient(pool.x, pool.y, 1, pool.x, pool.y, pool.radius);
  gradient.addColorStop(0, inner);
  gradient.addColorStop(1, outer);
  ctx.beginPath();
  ctx.arc(pool.x, pool.y, pool.radius, 0, Math.PI * 2);
  ctx.fillStyle = gradient;
  ctx.fill();
  // 테두리는 채우기보다 더 진하게 그려서 팀 색이 한눈에 보이게 함
  ctx.globalAlpha = Math.min(1, alpha + 0.4);
  ctx.lineWidth = 3;
  ctx.strokeStyle = stroke;
  ctx.stroke();
  ctx.globalAlpha = Math.min(1, alpha + 0.3);
  ctx.font = `${Math.min(28, pool.radius * 0.4)}px sans-serif`;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(isPoisonGas ? '💩' : '💧', pool.x, pool.y);
  ctx.restore();
}

function drawEffect(e) {
  if (e.type === 'lightning') {
    const alpha = Math.max(0, Math.min(1, e.life / 0.4));
    ctx.save();
    ctx.globalAlpha = alpha;
    ctx.beginPath();
    ctx.arc(e.x, e.y, e.radius, 0, Math.PI * 2);
    ctx.fillStyle = 'rgba(241, 196, 15, 0.25)';
    ctx.fill();
    ctx.lineWidth = 2;
    ctx.strokeStyle = 'rgba(241, 196, 15, 0.9)';
    ctx.stroke();
    ctx.font = `${e.radius}px sans-serif`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillStyle = '#fff';
    ctx.fillText('⚡', e.x, e.y);
    ctx.restore();
  } else if (e.type === 'explosion') {
    // 보배 폭발 - 크고 화려하게 터지는 폭발 이펙트
    const alpha = Math.max(0, Math.min(1, e.life / 0.4));
    ctx.save();
    ctx.globalAlpha = alpha;
    ctx.beginPath();
    ctx.arc(e.x, e.y, e.radius, 0, Math.PI * 2);
    ctx.fillStyle = 'rgba(255, 77, 109, 0.35)';
    ctx.fill();
    ctx.lineWidth = 3;
    ctx.strokeStyle = 'rgba(255, 77, 109, 0.95)';
    ctx.stroke();
    ctx.font = `${Math.min(40, e.radius * 0.5)}px sans-serif`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText('💥', e.x, e.y);
    ctx.restore();
  } else if (e.type === 'melee') {
    // 변기통의 뚫어뻥 휘두르기 - 바라보는 방향을 중심으로 한 부채꼴 스윙
    const alpha = Math.max(0, Math.min(1, e.life / 0.4));
    const halfAngle = ((e.arcDegrees || 90) * Math.PI) / 180 / 2;
    ctx.save();
    ctx.globalAlpha = alpha;
    ctx.beginPath();
    ctx.moveTo(e.x, e.y);
    ctx.arc(e.x, e.y, e.radius, e.angle - halfAngle, e.angle + halfAngle);
    ctx.closePath();
    ctx.fillStyle = 'rgba(149, 165, 166, 0.35)';
    ctx.fill();
    ctx.lineWidth = 2;
    ctx.strokeStyle = 'rgba(236, 240, 241, 0.9)';
    ctx.stroke();
    ctx.font = `${Math.min(28, e.radius * 0.3)}px sans-serif`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText('🪠', e.x + Math.cos(e.angle) * e.radius * 0.6, e.y + Math.sin(e.angle) * e.radius * 0.6);
    ctx.restore();
  }
}

// 맵을 둘러싸는 경계 벽 - 안(플레이 가능 구역)과 밖을 명확하게 구분해주는 두꺼운 벽 테두리
function drawArenaBoundary() {
  const t = 26; // 경계 벽 두께
  ctx.fillStyle = '#3b4a5a';
  ctx.strokeStyle = '#1a2531';
  ctx.lineWidth = 3;
  const frame = [
    { x: -t, y: -t, width: ARENA_WIDTH + t * 2, height: t },                  // 위쪽
    { x: -t, y: ARENA_HEIGHT, width: ARENA_WIDTH + t * 2, height: t },        // 아래쪽
    { x: -t, y: 0, width: t, height: ARENA_HEIGHT },                          // 왼쪽
    { x: ARENA_WIDTH, y: 0, width: t, height: ARENA_HEIGHT },                 // 오른쪽
  ];
  for (const r of frame) {
    ctx.fillRect(r.x, r.y, r.width, r.height);
    ctx.strokeRect(r.x, r.y, r.width, r.height);
  }
}

function drawWalls() {
  ctx.fillStyle = '#3b4a5a';
  ctx.strokeStyle = '#1a2531';
  ctx.lineWidth = 2;
  for (const w of WALLS) {
    ctx.fillRect(w.x, w.y, w.width, w.height);
    ctx.strokeRect(w.x, w.y, w.width, w.height);
  }
}

// 은신 가능한 덤불 - 벽과 달리 이동/총알은 막지 않고, 그 안에 들어가면 적에게 보이지 않게 됨
function drawBushes() {
  ctx.save();
  ctx.fillStyle = 'rgba(39, 174, 96, 0.55)';
  ctx.strokeStyle = 'rgba(20, 90, 50, 0.85)';
  ctx.lineWidth = 2;
  const r = 16; // 모서리를 둥글게
  for (const b of BUSHES) {
    ctx.beginPath();
    ctx.moveTo(b.x + r, b.y);
    ctx.arcTo(b.x + b.width, b.y, b.x + b.width, b.y + b.height, r);
    ctx.arcTo(b.x + b.width, b.y + b.height, b.x, b.y + b.height, r);
    ctx.arcTo(b.x, b.y + b.height, b.x, b.y, r);
    ctx.arcTo(b.x, b.y, b.x + b.width, b.y, r);
    ctx.closePath();
    ctx.fill();
    ctx.stroke();
  }
  ctx.restore();
}

function render() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  updateCamera();

  ctx.save();
  ctx.scale(cameraScale, cameraScale); // 화면 크기에 맞춰 맵 전체가 한 화면에 들어오도록 축소/확대
  ctx.translate(-camera.x, -camera.y); // 이 지점부터는 전부 '월드 좌표'로 그리면 카메라 위치에 맞게 화면에 표시됨

  // 화면에 실제로 보이는 영역의 가로/세로 폭(월드 좌표 기준)
  const viewW = canvas.width / cameraScale;
  const viewH = canvas.height / cameraScale;

  // 맵 밖(플레이 불가 구역)은 어둡게, 맵 안은 기존 배경색으로 채워서 안/밖을 명확히 구분
  ctx.fillStyle = '#0d1117';
  ctx.fillRect(camera.x, camera.y, viewW, viewH);
  ctx.fillStyle = '#2c3e50';
  ctx.fillRect(0, 0, ARENA_WIDTH, ARENA_HEIGHT);

  // 배경 격자 (단순 스타일) - 맵 내부 범위로만 제한해서 그림 (성능 + 안/밖 구분)
  ctx.strokeStyle = 'rgba(255,255,255,0.05)';
  const gridStartX = Math.max(0, Math.floor(camera.x / 50) * 50);
  const gridEndX = Math.min(ARENA_WIDTH, camera.x + viewW);
  const gridTop = Math.max(0, camera.y);
  const gridBottom = Math.min(ARENA_HEIGHT, camera.y + viewH);
  for (let x = gridStartX; x <= gridEndX; x += 50) {
    ctx.beginPath(); ctx.moveTo(x, gridTop); ctx.lineTo(x, gridBottom); ctx.stroke();
  }
  const gridStartY = Math.max(0, Math.floor(camera.y / 50) * 50);
  const gridEndY = Math.min(ARENA_HEIGHT, camera.y + viewH);
  const gridLeft = Math.max(0, camera.x);
  const gridRight = Math.min(ARENA_WIDTH, camera.x + viewW);
  for (let y = gridStartY; y <= gridEndY; y += 50) {
    ctx.beginPath(); ctx.moveTo(gridLeft, y); ctx.lineTo(gridRight, y); ctx.stroke();
  }

  drawArenaBoundary();
  drawWalls();
  drawBushes();

  const poolsArr = Array.isArray(latestState.waterPools) ? latestState.waterPools : [];
  for (const wp of poolsArr) drawWaterPool(wp);

  const effectsArr = Array.isArray(latestState.effects) ? latestState.effects : [];
  for (const e of effectsArr) drawEffect(e);

  const turretsArr = Array.isArray(latestState.turrets) ? latestState.turrets : [];
  for (const t of turretsArr) drawTurret(t);

  const chickensArr = Array.isArray(latestState.chickens) ? latestState.chickens : [];
  for (const c of chickensArr) drawChicken(c);

  const bombsArr = Array.isArray(latestState.bombs) ? latestState.bombs : [];
  for (const bomb of bombsArr) drawBomb(bomb);

  const bullets = Array.isArray(latestState.bullets) ? latestState.bullets : [];
  for (const b of bullets) drawBullet(b);

  const playersObj = latestState.players || {};
  for (const pid in playersObj) {
    const p = playersObj[pid];
    // 덤불/은신으로 숨어있는 적은 서버가 좌표(x, y) 자체를 보내지 않으므로 그릴 수 없음(=화면에 안 보임)
    if (typeof p.x !== 'number' || typeof p.y !== 'number') continue;
    drawPlayer(p, pid === myId);
    drawChatBubble(p);
  }

  drawAimRangeIndicator();

  ctx.restore();
}

function drawAimRangeIndicator() {
  // 조준 중일 때(모바일 오른쪽 조이스틱 드래그), 내 캐릭터 기준 사거리를 점선으로 표시
  // 궁극기가 장전된 상태면 궁극기 사거리를, 아니면 기본 공격 사거리를 보여준다.
  if (!touchAimActive) return;
  const me = latestState.players[myId];
  if (!me || !me.alive) return;

  let range, color;
  if (gadgetArmed && me.gadget && me.gadget.speed) {
    range = me.gadget.speed * me.gadget.lifetime;
    color = 'rgba(52, 152, 219, 0.9)'; // 가젯은 파란색으로 구분
  } else if (ultimateArmed && me.ultimate && me.ultimate.type !== 'lightning') {
    range = me.ultimate.speed * me.ultimate.lifetime;
    color = 'rgba(231, 76, 60, 0.85)'; // 궁극기는 빨간색으로 구분
  } else if (me.basic) {
    range = me.basic.speed * me.basic.lifetime;
    color = 'rgba(255, 255, 255, 0.6)';
  } else {
    return;
  }

  const endX = me.x + Math.cos(touchAimAngle) * range;
  const endY = me.y + Math.sin(touchAimAngle) * range;

  ctx.save();
  ctx.setLineDash([8, 8]);
  ctx.strokeStyle = color;
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(me.x, me.y);
  ctx.lineTo(endX, endY);
  ctx.stroke();

  // 사거리 끝 지점 표시
  ctx.setLineDash([]);
  ctx.beginPath();
  ctx.arc(endX, endY, 5, 0, Math.PI * 2);
  ctx.fillStyle = color;
  ctx.fill();
  ctx.restore();
}

function updateScoreboard() {
  const list = document.getElementById('scoreList');
  const playersArr = Object.values(latestState.players || {});

  if (matchMode === '2v2') {
    const sumScore = (arr) => arr.reduce((s, p) => s + p.score, 0);
    const myTeamArr = playersArr.filter((p) => p.team === myTeam);
    const oppTeamArr = playersArr.filter((p) => p.team !== myTeam);
    const renderTeam = (label, arr) => (
      `<li class="team-header"><b>${label} — ${sumScore(arr)}킬</b></li>` +
      arr.map((p) => `<li>${escapeHtml(p.name)}${p.id === myId ? ' (나)' : ''} — ${p.score}</li>`).join('')
    );
    list.innerHTML = renderTeam('우리 팀', myTeamArr) + renderTeam('상대 팀', oppTeamArr);
  } else {
    playersArr.sort((a, b) => b.score - a.score);
    list.innerHTML = playersArr
      .map((p) => `<li>${escapeHtml(p.name)}${p.id === myId ? ' (나)' : ''} — ${p.score}</li>`)
      .join('');
  }
}

function escapeHtml(str) {
  return String(str).replace(/[&<>"']/g, (c) => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
  }[c]));
}

let scoreboardTimer = 0;

function loop(now) {
  const dt = Math.min(0.05, (now - lastTime) / 1000);
  lastTime = now;

  try {
    update(dt);
    render();
  } catch (err) {
    // 렌더링 중 예상치 못한 에러가 나도 게임 루프 자체는 멈추지 않도록 방지
    console.error('게임 루프 에러:', err);
  }

  scoreboardTimer += dt;
  if (scoreboardTimer > 0.3) {
    updateScoreboard();
    scoreboardTimer = 0;
  }

  requestAnimationFrame(loop);
}

requestAnimationFrame(loop);
</script>
