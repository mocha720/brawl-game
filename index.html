<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<title>2D 멀티플레이 액션 게임</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    background: #1e1e2e;
    overflow: hidden;
    font-family: 'Segoe UI', sans-serif;
    color: #fff;
    width: 100%;
    height: 100%;
    touch-action: none;
    overscroll-behavior: none;
    -webkit-user-select: none;
    user-select: none;
  }
  #gameCanvas {
    display: block;
    margin: 20px auto 0 auto;
    background: #2c3e50;
    border: 3px solid #34495e;
    border-radius: 8px;
    cursor: crosshair;
    max-width: calc(100vw - 20px);
    max-height: calc(100vh - 30px);
    width: auto;
    height: auto;
    touch-action: none;
  }
  /* ===== 모바일 가상 조이스틱 ===== */
  .stick-base {
    position: fixed;
    bottom: 30px;
    width: 110px;
    height: 110px;
    border-radius: 50%;
    background: rgba(255, 255, 255, 0.12);
    border: 2px solid rgba(255, 255, 255, 0.3);
    touch-action: none;
    z-index: 5;
    display: none;
  }
  #leftStick { left: 25px; }
  #rightStick { right: 25px; }
  .stick-nub {
    position: absolute;
    top: 50%;
    left: 50%;
    width: 50px;
    height: 50px;
    margin: -25px 0 0 -25px;
    border-radius: 50%;
    background: rgba(255, 255, 255, 0.45);
    pointer-events: none;
  }
  body.touch-device .stick-base { display: block; }
  body.touch-device #hint { display: none; }
  #scoreboard {
    position: fixed;
    top: 20px;
    right: 30px;
    background: rgba(0, 0, 0, 0.55);
    border-radius: 8px;
    padding: 12px 16px;
    min-width: 160px;
  }
  #scoreboard h3 {
    margin: 0 0 8px 0;
    font-size: 15px;
    border-bottom: 1px solid #555;
    padding-bottom: 6px;
  }
  #scoreboard ol {
    margin: 0;
    padding-left: 18px;
    font-size: 13px;
    line-height: 1.6;
  }
  #joinOverlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.75);
    display: flex;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    z-index: 10;
  }
  #joinOverlay input {
    padding: 10px 14px;
    font-size: 16px;
    border-radius: 6px;
    border: none;
    margin: 12px 0;
    width: 220px;
    text-align: center;
  }
  #joinOverlay button {
    padding: 10px 24px;
    font-size: 16px;
    border-radius: 6px;
    border: none;
    background: #3498db;
    color: #fff;
    cursor: pointer;
  }
  #joinOverlay button:hover { background: #2980b9; }
  #hint {
    position: fixed;
    bottom: 12px;
    left: 20px;
    font-size: 12px;
    color: #aaa;
  }
  @media (max-width: 480px) {
    #scoreboard { top: 10px; right: 10px; min-width: 120px; padding: 8px 10px; }
    #scoreboard h3 { font-size: 12px; }
    #scoreboard ol { font-size: 11px; }
  }
</style>
</head>
<body>

<div id="joinOverlay">
  <h2>닉네임을 입력하세요</h2>
  <input id="nameInput" maxlength="12" placeholder="예: Hero" />
  <button id="joinBtn">게임 시작</button>
</div>

<div id="scoreboard">
  <h3>🏆 스코어보드</h3>
  <ol id="scoreList"></ol>
</div>

<canvas id="gameCanvas"></canvas>
<div id="hint">WASD / 방향키: 이동 &nbsp;|&nbsp; 마우스: 조준 &nbsp;|&nbsp; 좌클릭: 발사</div>

<!-- 모바일 전용 가상 조이스틱: 왼쪽=이동, 오른쪽=조준+발사 -->
<div id="leftStick" class="stick-base"><div class="stick-nub" id="leftNub"></div></div>
<div id="rightStick" class="stick-base"><div class="stick-nub" id="rightNub"></div></div>

<script src="/socket.io/socket.io.js"></script>
<script>
const socket = io();

const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

let myId = null;
let ARENA_WIDTH = 1000;
let ARENA_HEIGHT = 700;
let PLAYER_RADIUS = 20;
let BULLET_RADIUS = 6;
let MAX_HP = 100;

let latestState = { players: {}, bullets: [] };

// ===== 로컬 입력 상태 =====
const keys = { w: false, a: false, s: false, d: false, up: false, down: false, left: false, right: false };
let mouseX = 0, mouseY = 0;
let myAngle = 0;

// 자신의 로컬 위치(부드러운 이동을 위해 클라이언트에서 계산 후 서버로 전송)
let myX = 0, myY = 0;
let joined = false;
const MOVE_SPEED = 260; // px/초

// ===== 모바일(터치) 지원 =====
const isTouchDevice = ('ontouchstart' in window) || navigator.maxTouchPoints > 0;
if (isTouchDevice) {
  document.body.classList.add('touch-device');
}

// 왼쪽 조이스틱(이동) 입력값 (-1~1)
let touchMoveX = 0, touchMoveY = 0;
let touchMoveActive = false;

// 오른쪽 조이스틱(조준+발사) 입력값
let touchAimActive = false;
let touchAimAngle = 0;
let autoFireTimer = null;

function setupStick(baseId, nubId, onMove, onEnd) {
  const base = document.getElementById(baseId);
  const nub = document.getElementById(nubId);
  const maxDist = 40; // 조이스틱이 움직일 수 있는 최대 반경(px)
  let activeTouchId = null;

  function getCenter() {
    const rect = base.getBoundingClientRect();
    return { cx: rect.left + rect.width / 2, cy: rect.top + rect.height / 2 };
  }

  function handleMove(clientX, clientY) {
    const { cx, cy } = getCenter();
    let dx = clientX - cx;
    let dy = clientY - cy;
    const dist = Math.sqrt(dx * dx + dy * dy);
    if (dist > maxDist) {
      dx = (dx / dist) * maxDist;
      dy = (dy / dist) * maxDist;
    }
    nub.style.transform = `translate(${dx}px, ${dy}px)`;
    onMove(dx / maxDist, dy / maxDist, dx, dy);
  }

  function resetNub() {
    nub.style.transform = 'translate(0px, 0px)';
  }

  base.addEventListener('touchstart', (e) => {
    e.preventDefault();
    const t = e.changedTouches[0];
    activeTouchId = t.identifier;
    handleMove(t.clientX, t.clientY);
  }, { passive: false });

  base.addEventListener('touchmove', (e) => {
    e.preventDefault();
    for (const t of e.changedTouches) {
      if (t.identifier === activeTouchId) {
        handleMove(t.clientX, t.clientY);
      }
    }
  }, { passive: false });

  function onTouchEnd(e) {
    for (const t of e.changedTouches) {
      if (t.identifier === activeTouchId) {
        activeTouchId = null;
        resetNub();
        onEnd();
      }
    }
  }
  base.addEventListener('touchend', onTouchEnd, { passive: false });
  base.addEventListener('touchcancel', onTouchEnd, { passive: false });
}

setupStick('leftStick', 'leftNub',
  (nx, ny) => {
    touchMoveActive = true;
    touchMoveX = nx;
    touchMoveY = ny;
  },
  () => {
    touchMoveActive = false;
    touchMoveX = 0;
    touchMoveY = 0;
  }
);

setupStick('rightStick', 'rightNub',
  (nx, ny, dx, dy) => {
    // 아주 작은 움직임은 무시(오조준 방지)
    if (Math.abs(dx) < 4 && Math.abs(dy) < 4) return;
    touchAimActive = true;
    touchAimAngle = Math.atan2(dy, dx);
    if (!autoFireTimer) {
      socket.emit('shoot'); // 처음 잡는 순간 한 발 즉시 발사
      autoFireTimer = setInterval(() => {
        if (joined) socket.emit('shoot');
      }, 300); // 누르고 있는 동안 0.3초 간격 자동 발사
    }
  },
  () => {
    touchAimActive = false;
    if (autoFireTimer) {
      clearInterval(autoFireTimer);
      autoFireTimer = null;
    }
  }
);

// ===== 조인 처리 =====
document.getElementById('joinBtn').addEventListener('click', doJoin);
document.getElementById('nameInput').addEventListener('keydown', (e) => {
  if (e.key === 'Enter') doJoin();
});

function doJoin() {
  const name = document.getElementById('nameInput').value.trim() || 'Player';
  document.getElementById('joinOverlay').style.display = 'none';
  socket.emit('join', { name });
  joined = true;
  canvas.focus();
}

socket.on('init', (data) => {
  myId = data.id;
  ARENA_WIDTH = data.arena.width;
  ARENA_HEIGHT = data.arena.height;
  PLAYER_RADIUS = data.playerRadius;
  BULLET_RADIUS = data.bulletRadius;
  MAX_HP = data.maxHp;
  canvas.width = ARENA_WIDTH;
  canvas.height = ARENA_HEIGHT;
  myX = ARENA_WIDTH / 2;
  myY = ARENA_HEIGHT / 2;
});

socket.on('state', (state) => {
  latestState = state;
  // 서버가 갖고 있는 내 실제 위치와 동기화 (죽었을 때 등)
  const me = state.players[myId];
  if (me && !me.alive) {
    // 사망 중에는 서버 위치를 그대로 따라간다 (리스폰 위치 반영)
    myX = me.x;
    myY = me.y;
  }
});

// ===== 키보드 입력 =====
window.addEventListener('keydown', (e) => {
  switch (e.key) {
    case 'w': case 'W': case 'ArrowUp': keys.up = true; break;
    case 's': case 'S': case 'ArrowDown': keys.down = true; break;
    case 'a': case 'A': case 'ArrowLeft': keys.left = true; break;
    case 'd': case 'D': case 'ArrowRight': keys.right = true; break;
  }
});
window.addEventListener('keyup', (e) => {
  switch (e.key) {
    case 'w': case 'W': case 'ArrowUp': keys.up = false; break;
    case 's': case 'S': case 'ArrowDown': keys.down = false; break;
    case 'a': case 'A': case 'ArrowLeft': keys.left = false; break;
    case 'd': case 'D': case 'ArrowRight': keys.right = false; break;
  }
});

// ===== 마우스 입력 =====
// 캔버스가 CSS로 축소/확대되어 표시될 수 있으므로 내부 해상도 기준으로 좌표 보정
canvas.addEventListener('mousemove', (e) => {
  const rect = canvas.getBoundingClientRect();
  const scaleX = canvas.width / rect.width;
  const scaleY = canvas.height / rect.height;
  mouseX = (e.clientX - rect.left) * scaleX;
  mouseY = (e.clientY - rect.top) * scaleY;
});
canvas.addEventListener('mousedown', (e) => {
  if (e.button === 0 && joined) {
    socket.emit('shoot');
  }
});

// ===== 게임 루프 (클라이언트) =====
let lastTime = performance.now();

function update(dt) {
  if (!joined) return;
  const me = latestState.players[myId];
  if (me && !me.alive) return; // 사망 중에는 이동 불가

  let dx = 0, dy = 0;
  if (keys.up) dy -= 1;
  if (keys.down) dy += 1;
  if (keys.left) dx -= 1;
  if (keys.right) dx += 1;

  // 왼쪽 가상 조이스틱 입력 반영 (키보드와 동시 사용 시 합쳐짐)
  if (touchMoveActive) {
    dx += touchMoveX;
    dy += touchMoveY;
  }

  const len = Math.sqrt(dx * dx + dy * dy);
  if (len > 0.01) {
    // 조이스틱은 아날로그 값(0~1)이므로 그대로, 키보드(1 또는 √2)는 1로 눌러서 사용
    const magnitude = Math.min(1, len);
    myX += (dx / len) * magnitude * MOVE_SPEED * dt;
    myY += (dy / len) * magnitude * MOVE_SPEED * dt;
  }

  myX = Math.max(PLAYER_RADIUS, Math.min(ARENA_WIDTH - PLAYER_RADIUS, myX));
  myY = Math.max(PLAYER_RADIUS, Math.min(ARENA_HEIGHT - PLAYER_RADIUS, myY));

  // 오른쪽 조이스틱으로 조준 중이면 그 방향을, 아니면 마우스 방향을 바라봄
  myAngle = touchAimActive ? touchAimAngle : Math.atan2(mouseY - myY, mouseX - myX);

  socket.emit('playerUpdate', { x: myX, y: myY, angle: myAngle });
}

function drawPlayer(p, isMe) {
  // 몸통
  ctx.save();
  ctx.translate(p.x, p.y);

  if (!p.alive) {
    ctx.globalAlpha = 0.25; // 사망 상태는 반투명 처리
  }

  ctx.beginPath();
  ctx.arc(0, 0, PLAYER_RADIUS, 0, Math.PI * 2);
  ctx.fillStyle = p.color || '#3498db';
  ctx.fill();
  ctx.lineWidth = isMe ? 3 : 1.5;
  ctx.strokeStyle = isMe ? '#fff' : '#222';
  ctx.stroke();

  // 바라보는 방향 표시
  ctx.rotate(p.angle);
  ctx.beginPath();
  ctx.moveTo(0, 0);
  ctx.lineTo(PLAYER_RADIUS + 10, 0);
  ctx.strokeStyle = '#fff';
  ctx.lineWidth = 3;
  ctx.stroke();

  ctx.restore();
  ctx.globalAlpha = 1;

  if (!p.alive) return; // 사망 중에는 이름/HP 표시 생략

  // 닉네임
  ctx.font = 'bold 13px sans-serif';
  ctx.textAlign = 'center';
  ctx.fillStyle = '#fff';
  ctx.fillText(p.name, p.x, p.y - PLAYER_RADIUS - 22);

  // HP 바
  const barW = 44, barH = 6;
  const hpRatio = Math.max(0, p.hp / MAX_HP);
  ctx.fillStyle = '#555';
  ctx.fillRect(p.x - barW / 2, p.y - PLAYER_RADIUS - 16, barW, barH);
  ctx.fillStyle = hpRatio > 0.5 ? '#2ecc71' : hpRatio > 0.2 ? '#f1c40f' : '#e74c3c';
  ctx.fillRect(p.x - barW / 2, p.y - PLAYER_RADIUS - 16, barW * hpRatio, barH);
}

function drawBullet(b) {
  ctx.beginPath();
  ctx.arc(b.x, b.y, BULLET_RADIUS, 0, Math.PI * 2);
  ctx.fillStyle = '#f39c12';
  ctx.fill();
}

function render() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  // 배경 격자 (단순 스타일)
  ctx.strokeStyle = 'rgba(255,255,255,0.05)';
  for (let x = 0; x < ARENA_WIDTH; x += 50) {
    ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, ARENA_HEIGHT); ctx.stroke();
  }
  for (let y = 0; y < ARENA_HEIGHT; y += 50) {
    ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(ARENA_WIDTH, y); ctx.stroke();
  }

  const bullets = Array.isArray(latestState.bullets) ? latestState.bullets : [];
  for (const b of bullets) drawBullet(b);

  const playersObj = latestState.players || {};
  for (const pid in playersObj) {
    drawPlayer(playersObj[pid], pid === myId);
  }
}

function updateScoreboard() {
  const list = document.getElementById('scoreList');
  const playersArr = Object.values(latestState.players || {});
  playersArr.sort((a, b) => b.score - a.score);
  list.innerHTML = playersArr
    .map((p) => `<li>${escapeHtml(p.name)}${p.id === myId ? ' (나)' : ''} — ${p.score}</li>`)
    .join('');
}

function escapeHtml(str) {
  return String(str).replace(/[&<>"']/g, (c) => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
  }[c]));
}

let scoreboardTimer = 0;

function loop(now) {
  const dt = Math.min(0.05, (now - lastTime) / 1000);
  lastTime = now;

  try {
    update(dt);
    render();
  } catch (err) {
    // 렌더링 중 예상치 못한 에러가 나도 게임 루프 자체는 멈추지 않도록 방지
    console.error('게임 루프 에러:', err);
  }

  scoreboardTimer += dt;
  if (scoreboardTimer > 0.3) {
    updateScoreboard();
    scoreboardTimer = 0;
  }

  requestAnimationFrame(loop);
}

requestAnimationFrame(loop);
</script>
</body>
</html>
